<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fast Track de Contingência V0.6 | HS</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef3f6;font-family:Arial,sans-serif}
    #app{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#eef3f6;color:#176d91;font-weight:700;text-align:center;padding:24px}
    #loading.error{color:#8b3131;background:#fff3f3;white-space:pre-wrap}
  </style>
</head>
<body>
  <iframe id="app" src="index.html?v=060" title="Fast Track de Contingência V0.6"></iframe>
  <div id="loading">Preparando o Fast Track de Contingência V0.6…</div>
  <script>
  (()=>{
    const frame=document.getElementById('app'),loading=document.getElementById('loading');
    function css(doc,href){return new Promise((res,rej)=>{const l=doc.createElement('link');l.rel='stylesheet';l.href=href;l.onload=res;l.onerror=()=>rej(new Error(`Falha ao carregar ${href}`));doc.head.appendChild(l);});}
    function script(doc,src){return new Promise((res,rej)=>{const s=doc.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error(`Falha ao carregar ${src}`));doc.head.appendChild(s);});}
    frame.addEventListener('load',async()=>{try{
      const d=frame.contentDocument,w=frame.contentWindow;w.V06_BASE='v06/';
      await css(d,'v06/v06.css?v=061');
      try{await script(d,'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');}catch{await script(d,'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');}
      await script(d,'v06/payload/p01.js?v=061');
      await script(d,'v06/payload/p02.js?v=061');
      await script(d,'v06/payload/p03.js?v=061');
      await script(d,'v06/payload/p04.js?v=061');
      await script(d,'v06/payload/p05.js?v=061');
      await script(d,'v06/payload/p06.js?v=061');
      await script(d,'v06/payload/p07.js?v=061');
      await script(d,'v06/payload/p08.js?v=061');
      await script(d,'v06/payload/p09.js?v=061');
      await script(d,'v06/payload/p10.js?v=061');
      await script(d,'v06/payload/p11.js?v=061');
      await script(d,'v06/payload/p12.js?v=061');
      await script(d,'v06/payload/p13.js?v=061');
      await script(d,'v06/payload/p14.js?v=061');
      await script(d,'v06/payload/p15.js?v=061');
      await script(d,'v06/payload/p16.js?v=061');
      await script(d,'v06/payload/p17.js?v=061');
      await script(d,'v06/payload/p18.js?v=061');
      await script(d,'v06/payload/bootstrap.js?v=061');
      await w.FastTrackV06.ready;loading.remove();
    }catch(e){console.error(e);loading.classList.add('error');loading.textContent='Não foi possível carregar a V0.6. Atualize a página e tente novamente.\n\n'+(e.message||e);}});
  })();
  </script>
</body>
</html>
