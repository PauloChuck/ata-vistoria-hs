<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fast Track — Relatórios 0.5 | HS</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef3f6;font-family:Arial,sans-serif}
    #app{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#eef3f6;color:#176d91;font-weight:700;text-align:center;padding:24px}
    #loading.error{color:#8b3131;background:#fff3f3;white-space:pre-wrap}
  </style>
</head>
<body>
  <iframe id="app" src="index.html?v=05" title="Fast Track — Contingência"></iframe>
  <div id="loading">Preparando o Fast Track e os relatórios Word/PDF no padrão oficial…</div>
  <script>
    (() => {
      const frame = document.getElementById('app');
      const loading = document.getElementById('loading');
      const templateScripts = [
        'v04_template/t01.js?v=053','v04_template/t02.js?v=053',
        'v04_template/t03.js?v=053','v04_template/t04.js?v=053',
        'v04_template/fetch_shim.js?v=053'
      ];
      const reportScripts = [
        'v05_assets/w01.js?v=053',
        'v05_report/r01.js?v=053',
        'v05_report/loader.js?v=053'
      ];

      function loadScript(doc, src) {
        return new Promise((resolve, reject) => {
          const script = doc.createElement('script');
          script.src = src;
          script.onload = () => resolve(script);
          script.onerror = () => reject(new Error(`Falha ao carregar ${src}`));
          doc.head.appendChild(script);
        });
      }

      function waitFor(win, predicate, message, timeout = 20000) {
        return new Promise((resolve, reject) => {
          const started = Date.now();
          const timer = setInterval(() => {
            if (predicate(win)) {
              clearInterval(timer);
              resolve();
              return;
            }
            if (Date.now() - started > timeout) {
              clearInterval(timer);
              reject(new Error(message));
            }
          }, 80);
        });
      }

      frame.addEventListener('load', async () => {
        try {
          const doc = frame.contentDocument;
          const win = frame.contentWindow;
          try {
            await loadScript(doc, 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
          } catch {
            await loadScript(doc, 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
          }
          for (const src of templateScripts) await loadScript(doc, src);
          for (const src of reportScripts) await loadScript(doc, src);
          await waitFor(
            win,
            (target) => Boolean(target.fastTrackReportV05?.exportWord && target.fastTrackReportV05?.exportPdf),
            'Tempo excedido ao iniciar os geradores de relatório V0.5.'
          );
          loading.remove();
        } catch (error) {
          console.error(error);
          loading.classList.add('error');
          loading.textContent = 'Não foi possível carregar os geradores Word/PDF V0.5. Atualize a página e tente novamente.\n\n' + (error?.message || error);
        }
      });
    })();
  </script>
</body>
</html>
