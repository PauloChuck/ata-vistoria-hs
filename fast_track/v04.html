<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fast Track — Contingência 0.4 | HS</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef3f6;font-family:Arial,sans-serif}
    #app{width:100%;height:100%;border:0;display:block;background:#fff}
    #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#eef3f6;color:#176d91;font-weight:700;text-align:center;padding:24px}
    #loading.error{color:#8b3131;background:#fff3f3}
  </style>
</head>
<body>
  <iframe id="app" src="index.html?v=04" title="Fast Track — Contingência"></iframe>
  <div id="loading">Preparando o Fast Track e o Word no padrão de contingência…</div>
  <script>
    (() => {
      const frame = document.getElementById('app');
      const loading = document.getElementById('loading');
      const scripts = [
        'v04_parts/q01.js?v=040','v04_parts/q02.js?v=040','v04_parts/q03.js?v=040',
        'v04_parts/q04.js?v=040','v04_parts/q05.js?v=040','v04_parts/q06.js?v=040',
        'v04_parts/q07.js?v=040','v04_parts/loader.js?v=040'
      ];

      function loadScript(doc,src){
        return new Promise((resolve,reject)=>{
          const script=doc.createElement('script');
          script.src=src;
          script.onload=()=>resolve(script);
          script.onerror=()=>reject(new Error(`Falha ao carregar ${src}`));
          doc.head.appendChild(script);
        });
      }

      function waitForReady(win,timeout=15000){
        return new Promise((resolve,reject)=>{
          const started=Date.now();
          const timer=setInterval(()=>{
            if(win.fastTrackWordV04?.exportWordV04){
              clearInterval(timer);resolve();return;
            }
            if(Date.now()-started>timeout){
              clearInterval(timer);reject(new Error('Tempo excedido ao iniciar o gerador Word 0.4.'));
            }
          },80);
        });
      }

      frame.addEventListener('load',async()=>{
        try{
          const doc=frame.contentDocument;
          try{
            await loadScript(doc,'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
          }catch{
            await loadScript(doc,'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
          }
          for(const src of scripts) await loadScript(doc,src);
          await waitForReady(frame.contentWindow);
          loading.remove();
        }catch(error){
          console.error(error);
          loading.classList.add('error');
          loading.textContent='Não foi possível carregar o gerador Word 0.4. Atualize a página e tente novamente.';
        }
      });
    })();
  </script>
</body>
</html>
