name: Verify V062 public footer fonts and flow

on:
  push:
    branches:
      - verification/v062-public
    paths:
      - .github/workflows/verify-v062-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Chrome test
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Test published preview, PDF and Word
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-public-footer-flow
          mkdir -p "$OUT"
          cat > "$OUT/test.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async()=>{
            const out='/tmp/v062-public-footer-flow';
            const url='https://paulochuck.github.io/ata-vistoria-hs/fast_track/v062.html?v=0625-public-ci';
            const browser=await chromium.launch({
              headless:true,
              executablePath:process.env.CHROME_PATH,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const pageErrors=[];
            const httpErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            page.on('response',response=>{
              if(response.status()>=400 && !/favicon\.ico/i.test(response.url())){
                httpErrors.push({status:response.status(),url:response.url()});
              }
            });
            page.on('dialog',dialog=>dialog.accept());

            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible',timeout:30000});
            const init=await page.evaluate(()=>({
              report:Boolean(window.FastTrackV06Report),
              word:Boolean(window.FastTrackV06Word),
              docx:Boolean(window.docx),
              branding:Boolean(window.FastTrackV06BrandAssets),
              screens:document.querySelectorAll('.screen').length,
              steps:document.querySelectorAll('#progress span').length
            }));
            if(!init.report||!init.word||!init.docx||!init.branding||init.screens!==7||init.steps!==7){
              throw new Error(`Inicialização pública incompleta: ${JSON.stringify(init)}`);
            }

            await page.click('[data-action="load-example"]');
            for(const step of [2,3,4,5,6,7]){
              await page.click(`[data-go="${step}"]`);
              await page.waitForSelector(`.screen[data-step="${step}"].active`);
            }
            await page.waitForSelector('#reportPreview .report-page');

            const preview=await page.evaluate(()=>{
              const mm=px=>px*25.4/96;
              const pages=[...document.querySelectorAll('#reportPreview .report-page')];
              const first=pages[0];
              const bodyPage=pages.find(p=>p.querySelector('.doc-section')) || pages[1];
              const styleOf=(selector,root=document)=>{
                const element=root.querySelector(selector);
                if(!element) return null;
                const style=getComputedStyle(element);
                return {font:style.fontFamily,size:style.fontSize,color:style.color,weight:style.fontWeight,style:style.fontStyle,lineHeight:style.lineHeight,textAlign:style.textAlign};
              };
              return {
                pages:pages.length,
                titleStyle:styleOf('.doc-title',first),
                subtitleStyle:styleOf('.doc-subtitle',first),
                metaStyle:styleOf('.meta-table td',first),
                claimStyle:styleOf('.claim-table td',first),
                bodyStyle:styleOf('.doc-text',bodyPage),
                headingStyle:styleOf('.doc-section',bodyPage),
                subheadingStyle:styleOf('.doc-subsection',bodyPage),
                details:pages.map((p,index)=>{
                  const pr=p.getBoundingClientRect();
                  const content=p.querySelector('.report-content');
                  const footer=p.querySelector('.report-footer');
                  const mark=p.querySelector('.report-footer-mark');
                  const address=p.querySelector('.report-footer-address');
                  const contact=p.querySelector('.report-footer-contact');
                  const number=p.querySelector('.report-page-number');
                  const cr=content.getBoundingClientRect();
                  const fr=footer.getBoundingClientRect();
                  const mr=mark.getBoundingClientRect();
                  const nr=number.getBoundingClientRect();
                  const as=getComputedStyle(address);
                  const ns=getComputedStyle(number);
                  return {
                    page:index+1,
                    overflow:content.scrollHeight-content.clientHeight,
                    contentBottom:mm(cr.bottom-pr.top),
                    footerTop:mm(fr.top-pr.top),
                    markCount:p.querySelectorAll('.report-footer-mark').length,
                    mark:{width:mm(mr.width),height:mm(mr.height)},
                    address:address.textContent,
                    contact:contact.textContent,
                    number:number.textContent,
                    addressStyle:{font:as.fontFamily,size:as.fontSize,color:as.color,weight:as.fontWeight,style:as.fontStyle},
                    numberStyle:{font:ns.fontFamily,size:ns.fontSize,color:ns.color,style:ns.fontStyle,right:mm(pr.right-nr.right)}
                  };
                })
              };
            });

            const near=(a,b,t=.4)=>Math.abs(a-b)<=t;
            if(preview.pages<2) throw new Error('O relatório público não gerou múltiplas páginas.');
            for(const item of preview.details){
              if(item.overflow>2) throw new Error(`Overflow na página ${item.page}: ${item.overflow}px`);
              if(item.contentBottom>=item.footerTop) throw new Error(`Conteúdo invadiu o rodapé na página ${item.page}`);
              if(item.markCount!==1||!near(item.mark.width,22.2)||!near(item.mark.height,16.5)) throw new Error(`Símbolo do rodapé inválido na página ${item.page}: ${JSON.stringify(item.mark)}`);
              if(item.address!=='Matriz - Rua XV de novembro 1336, salas 34 e 35 – Blumenau – SC – CEP 89010-903') throw new Error(`Endereço inválido na página ${item.page}`);
              if(item.contact!=='www.horizonservitas.com +55 47 3326-1844') throw new Error(`Contato inválido na página ${item.page}`);
              if(item.number!==`${item.page} de ${preview.pages}`) throw new Error(`Numeração inválida: ${item.number}`);
              if(!/Calibri/i.test(item.addressStyle.font)||item.addressStyle.size!=='13.3333px'||item.addressStyle.color!=='rgb(41, 168, 224)'||item.addressStyle.weight!=='400'||item.addressStyle.style!=='normal') throw new Error(`Fonte do rodapé inválida: ${JSON.stringify(item.addressStyle)}`);
              if(!/Arial/i.test(item.numberStyle.font)||item.numberStyle.size!=='13.3333px'||item.numberStyle.color!=='rgb(0, 0, 0)'||item.numberStyle.style!=='italic') throw new Error(`Fonte da paginação inválida: ${JSON.stringify(item.numberStyle)}`);
            }
            const px=(pt)=>`${pt*96/72}px`;
            if(preview.titleStyle?.size!==px(28)||!/Arial Black/i.test(preview.titleStyle?.font||'')) throw new Error(`Título da capa fora do padrão: ${JSON.stringify(preview.titleStyle)}`);
            if(preview.subtitleStyle?.size!==px(24)||!/Arial Black/i.test(preview.subtitleStyle?.font||'')) throw new Error(`Subtítulo fora do padrão: ${JSON.stringify(preview.subtitleStyle)}`);
            if(preview.metaStyle?.size!==px(12)||!/Arial/i.test(preview.metaStyle?.font||'')) throw new Error(`Dados da capa fora do padrão: ${JSON.stringify(preview.metaStyle)}`);
            if(preview.claimStyle?.size!==px(11)||!/Arial/i.test(preview.claimStyle?.font||'')) throw new Error(`Sinistros da capa fora do padrão: ${JSON.stringify(preview.claimStyle)}`);
            if(preview.bodyStyle?.size!==px(11)||!/Arial/i.test(preview.bodyStyle?.font||'')||preview.bodyStyle?.textAlign!=='justify') throw new Error(`Corpo fora do padrão: ${JSON.stringify(preview.bodyStyle)}`);
            if(preview.headingStyle?.size!==px(14)||!/Arial Black/i.test(preview.headingStyle?.font||'')) throw new Error(`Título principal fora do padrão: ${JSON.stringify(preview.headingStyle)}`);
            if(preview.subheadingStyle?.size!==px(12)||!/Arial/i.test(preview.subheadingStyle?.font||'')) throw new Error(`Subtítulo fora do padrão: ${JSON.stringify(preview.subheadingStyle)}`);

            await page.locator('#reportPreview .report-page').first().screenshot({path:path.join(out,'public-capa.png')});
            await page.locator('#reportPreview .report-page').last().screenshot({path:path.join(out,'public-final.png')});

            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            const printPages=await page.evaluate(()=>[...document.querySelectorAll('#printHost .report-page')].map((p,index,total)=>({
              mark:p.querySelectorAll('.report-footer-mark').length,
              address:p.querySelector('.report-footer-address')?.textContent,
              number:p.querySelector('.report-page-number')?.textContent,
              expected:`${index+1} de ${total.length}`
            })));
            if(!printPages.every(p=>p.mark===1&&p.address?.startsWith('Matriz - Rua XV')&&p.number===p.expected)){
              throw new Error(`Rodapé inconsistente na impressão: ${JSON.stringify(printPages)}`);
            }
            await page.emulateMedia({media:'print'});
            await page.pdf({path:path.join(out,'public-preview.pdf'),format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const pending=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await pending;
            const wordPath=path.join(out,download.suggestedFilename());
            await download.saveAs(wordPath);
            if(!fs.existsSync(wordPath)||fs.statSync(wordPath).size<15000) throw new Error(`DOCX público inválido: ${wordPath}`);

            if(pageErrors.length||httpErrors.length) throw new Error(JSON.stringify({pageErrors,httpErrors}));
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify({url,init,preview,printPages,wordPath,wordBytes:fs.statSync(wordPath).size},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

      - name: Validate public DOCX footer and pagination
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-public-footer-flow
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('/tmp/v062-public-footer-flow/docx/word')
          checked=[]
          for name in ['footer1.xml','footer2.xml']:
              xml=(root/name).read_text(encoding='utf-8')
              required=['PAGE','NUMPAGES','Calibri','29A8E0','Arial','Matriz - Rua XV de novembro 1336','www.horizonservitas.com +55 47 3326-1844']
              missing=[value for value in required if value not in xml]
              if missing:
                  raise SystemExit(f'{name}: ausentes {missing}')
              checked.append({'footer':name,'ok':True})
          document=(root/'document.xml').read_text(encoding='utf-8')
          if document.count('w:tblHeader')<2:
              raise SystemExit('Cabeçalhos repetidos das tabelas ausentes')
          if document.count('w:cantSplit')<4:
              raise SystemExit('Proteção de linhas/blocos insuficiente')
          Path('/tmp/v062-public-footer-flow/docx-result.json').write_text(json.dumps(checked,indent=2),encoding='utf-8')
          print(json.dumps(checked,indent=2))
          PY
          cat "$OUT/result.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v062-public-footer-flow
          path: /tmp/v062-public-footer-flow
          if-no-files-found: warn
