name: Verify V062 public institutional branding

on:
  push:
    branches:
      - verification/v062-public
    paths:
      - .github/workflows/verify-v062-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Chrome test
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Test published watermark in preview, PDF and Word
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v062-public-branding
          cat > /tmp/v062-public-branding/test.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async()=>{
            const out='/tmp/v062-public-branding';
            const url='https://paulochuck.github.io/ata-vistoria-hs/fast_track/v062.html?v=0624-public-ci';
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const pageErrors=[]; const httpErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            page.on('response',response=>{if(response.status()>=400&&!/favicon\.ico/i.test(response.url()))httpErrors.push({status:response.status(),url:response.url()});});
            page.on('dialog',async dialog=>dialog.accept());

            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible',timeout:30000});
            const init=await page.evaluate(()=>({
              report:Boolean(window.FastTrackV06Report),
              word:Boolean(window.FastTrackV06Word),
              docx:Boolean(window.docx),
              branding:Boolean(window.FastTrackV06BrandAssets),
              logoPrefix:window.FastTrackV06BrandAssets?.logo?.slice(0,22),
              watermarkPrefix:window.FastTrackV06BrandAssets?.watermark?.slice(0,28)
            }));
            if(!init.report||!init.word||!init.docx||!init.branding) throw new Error(`Inicialização incompleta: ${JSON.stringify(init)}`);
            if(init.logoPrefix!=='data:image/png;base64,') throw new Error(`Logotipo incorreto: ${init.logoPrefix}`);
            if(!init.watermarkPrefix.startsWith('data:image/svg+xml')) throw new Error(`Marca-d'água incorreta: ${init.watermarkPrefix}`);

            await page.click('[data-action="load-example"]');
            for(const step of [2,3,4,5,6,7]){
              await page.click(`[data-go="${step}"]`);
              await page.waitForSelector(`.screen[data-step="${step}"].active`);
            }
            await page.waitForSelector('#reportPreview .report-page');

            const pages=await page.evaluate(()=>{
              const mm=px=>px*25.4/96;
              return [...document.querySelectorAll('#reportPreview .report-page')].map((p,index)=>{
                const pr=p.getBoundingClientRect();
                const wm=p.querySelector('.report-watermark');
                const logo=p.querySelector('.report-logo');
                const wr=wm.getBoundingClientRect();
                const lr=logo.getBoundingClientRect();
                return {
                  page:index+1,
                  watermarkCount:p.querySelectorAll('.report-watermark').length,
                  logoCount:p.querySelectorAll('.report-logo').length,
                  watermark:{left:mm(wr.left-pr.left),top:mm(wr.top-pr.top),width:mm(wr.width),height:mm(wr.height),opacity:getComputedStyle(wm).opacity,src:wm.src.slice(0,28)},
                  logo:{right:mm(pr.right-lr.right),top:mm(lr.top-pr.top),width:mm(lr.width),height:mm(lr.height),src:logo.src.slice(0,22)}
                };
              });
            });
            const near=(a,b,t=.3)=>Math.abs(a-b)<=t;
            if(pages.length<2) throw new Error('O relatório de teste não gerou múltiplas páginas');
            for(const item of pages){
              if(item.watermarkCount!==1||item.logoCount!==1) throw new Error(`Duplicação ou ausência na página ${item.page}: ${JSON.stringify(item)}`);
              if(!near(item.watermark.left,30)||!near(item.watermark.top,88.875)||!near(item.watermark.width,160)||!near(item.watermark.height,119.25)||item.watermark.opacity!=='1') throw new Error(`Marca-d'água fora do padrão na página ${item.page}: ${JSON.stringify(item.watermark)}`);
              if(!near(item.logo.right,10)||!near(item.logo.top,1)||!near(item.logo.width,68.5)||!near(item.logo.height,33)) throw new Error(`Logotipo fora do padrão na página ${item.page}: ${JSON.stringify(item.logo)}`);
            }
            await page.locator('#reportPreview .report-page').first().screenshot({path:path.join(out,'public-capa.png')});
            await page.locator('#reportPreview .report-page').nth(1).screenshot({path:path.join(out,'public-interna.png')});

            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            const printPages=await page.evaluate(()=>[...document.querySelectorAll('#printHost .report-page')].map(p=>({wm:p.querySelectorAll('.report-watermark').length,logo:p.querySelectorAll('.report-logo').length})));
            if(!printPages.every(p=>p.wm===1&&p.logo===1)) throw new Error(`Ativos inconsistentes no PDF: ${JSON.stringify(printPages)}`);
            await page.emulateMedia({media:'print'});
            await page.pdf({path:path.join(out,'public-watermark.pdf'),format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const downloadPromise=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await downloadPromise;
            const wordPath=path.join(out,download.suggestedFilename());
            await download.saveAs(wordPath);
            if(!fs.existsSync(wordPath)||fs.statSync(wordPath).size<15000) throw new Error(`DOCX público inválido: ${wordPath}`);

            if(pageErrors.length||httpErrors.length) throw new Error(JSON.stringify({pageErrors,httpErrors}));
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify({url,init,pages,printPages,wordPath,wordBytes:fs.statSync(wordPath).size},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/v062-public-branding/test.js

      - name: Validate public DOCX header XML
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-public-branding
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          root=Path('/tmp/v062-public-branding/docx')
          ns={'wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing'}
          expected_logo=(2466000,1188000)
          expected_wm=(5760000,4293000)
          checked=[]
          for name in ['header1.xml','header2.xml']:
              tree=ET.parse(root/'word'/name).getroot()
              inlines=tree.findall('.//wp:inline',ns)
              anchors=tree.findall('.//wp:anchor',ns)
              if len(inlines)!=1 or len(anchors)!=1:
                  raise SystemExit(f'{name}: inline={len(inlines)} anchor={len(anchors)}')
              logo_ext=inlines[0].find('wp:extent',ns)
              wm_ext=anchors[0].find('wp:extent',ns)
              logo=(int(logo_ext.attrib['cx']),int(logo_ext.attrib['cy']))
              watermark=(int(wm_ext.attrib['cx']),int(wm_ext.attrib['cy']))
              if logo!=expected_logo: raise SystemExit(f'{name}: logotipo {logo}')
              if watermark!=expected_wm: raise SystemExit(f'{name}: marca-d’água {watermark}')
              if anchors[0].attrib.get('behindDoc')!='1': raise SystemExit(f'{name}: behindDoc ausente')
              checked.append({'header':name,'logo':logo,'watermark':watermark,'behindDoc':'1'})
          Path('/tmp/v062-public-branding/docx-result.json').write_text(json.dumps(checked,indent=2),encoding='utf-8')
          print(json.dumps(checked,indent=2))
          PY
          cat "$OUT/result.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v062-public-institutional-branding
          path: /tmp/v062-public-branding
          if-no-files-found: warn
