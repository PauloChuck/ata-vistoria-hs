name: Implement V0628 editable narratives V6

on:
  push:
    branches:
      - feature/v062-editable-narratives-doc-intro
    paths:
      - .github/workflows/implement-v0628-editable-narratives-v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/patch_v0628.py')
          text=path.read_text(encoding='utf-8')
          old="    result, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new="    result, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if old not in text:
              raise SystemExit('Função regex_once esperada não encontrada.')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/patch_v0628.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('fast_track/v06/direct-app.js')
          text=path.read_text(encoding='utf-8')
          replacement="    for (const id of ['lossDate','noticeDate','scheduleDate','inspectionDate','reportDate']) { if (f[id] && !REPORT().isValidIsoDate(f[id])) { const dateLabel=document.querySelector('label[for=\\\"'+id+'\\\"]')?.textContent || id; errors.push(`Informe uma data válida em: ${dateLabel}.`); } }"
          text,count=re.subn(r"    for \(const id of \['lossDate','noticeDate','scheduleDate','inspectionDate','reportDate'\]\) \{ if \(f\[id\] && !REPORT\(\)\.isValidIsoDate\(f\[id\]\)\) errors\.push\(`Informe uma data válida em: .*?\); \}",lambda _m:replacement,text)
          if count < 1:
              raise SystemExit('Não foi possível corrigir a validação das datas no JavaScript.')
          path.write_text(text,encoding='utf-8')
          PY

          node --check fast_track/v06/direct-app.js
          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          grep -q 'occurrenceNarrative' fast_track/v06/direct-app.js
          grep -q 'effectiveOccurrenceText' fast_track/v06/direct-report.js
          grep -q 'effectiveInspectionText' fast_track/v06/direct-word.js
          grep -q 'Em vistoria foram coletados os documentos abaixo relacionados' fast_track/v06/direct-report.js
          grep -q 'v=0628' fast_track/v062.html
          ! grep -q 'A data do sinistro deve pertencer a novembro de 2026' fast_track/v06/direct-app.js
          ! grep -q 'occurrenceAutoText' fast_track/v062.html
          ! grep -q 'inspectionAutoText' fast_track/v062.html

      - name: Prepare browser and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Run acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0628-validation
          mkdir -p "$OUT"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/test_v0628.js')
          text=path.read_text(encoding='utf-8')
          old_go='''async function go(page, step) {
            await page.locator(`[data-go="${step}"]`).first().click();
            await page.waitForSelector(`.screen[data-step="${step}"].active`);
          }'''
          new_go='''async function go(page, step) {
            await page.evaluate((targetStep) => document.querySelector(`[data-go="${targetStep}"]`).click(), step);
            await page.waitForSelector(`.screen[data-step="${step}"].active`);
          }'''
          if old_go not in text:
              raise SystemExit('Helper go não localizado no teste.')
          text=text.replace(old_go,new_go,1)
          first_wait="await page.waitForSelector('.app-shell',{state:'visible'});"
          text=text.replace(first_wait,first_wait+"\n  await page.waitForFunction(() => document.querySelector('#occurrenceNarrative')?.value.length > 0 && document.querySelector('#inspectionNarrative')?.value.length > 0,{timeout:30000});",1)
          first_reload="""  await page.reload({waitUntil:'networkidle'});
          await page.waitForSelector('.app-shell',{state:'visible'});
          if (await page.inputValue('#occurrenceNarrative') !== '') throw new Error('A ocorrência apagada intencionalmente foi restaurada automaticamente.');"""
          first_reload_new="""  await page.reload({waitUntil:'networkidle'});
          await page.waitForSelector('.app-shell',{state:'visible'});
          await page.waitForFunction(() => document.querySelector('#inspectionNarrative')?.value.length > 0,{timeout:30000});
          if (await page.inputValue('#occurrenceNarrative') !== '') throw new Error('A ocorrência apagada intencionalmente foi restaurada automaticamente.');"""
          if first_reload not in text:
              raise SystemExit('Bloco de recarga com campo vazio não localizado.')
          text=text.replace(first_reload,first_reload_new,1)
          second_reload="""  await page.reload({waitUntil:'networkidle'});
          await page.waitForSelector('.app-shell',{state:'visible'});
          if (await page.inputValue('#occurrenceNarrative') !== finalOccurrence) throw new Error('Ocorrência personalizada não persistiu após recarregar.');"""
          second_reload_new="""  await page.reload({waitUntil:'networkidle'});
          await page.waitForSelector('.app-shell',{state:'visible'});
          await page.waitForFunction((expected) => document.querySelector('#occurrenceNarrative')?.value === expected,{timeout:30000},finalOccurrence);
          if (await page.inputValue('#occurrenceNarrative') !== finalOccurrence) throw new Error('Ocorrência personalizada não persistiu após recarregar.');"""
          if second_reload not in text:
              raise SystemExit('Bloco de recarga com texto personalizado não localizado.')
          text=text.replace(second_reload,second_reload_new,1)
          text=text.replace("await page.click('[data-action=\"restore-occurrence-default\"]');","await page.evaluate(() => document.querySelector('[data-action=\\\"restore-occurrence-default\\\"]').click());")
          text=text.replace("await page.click('[data-action=\"restore-inspection-default\"]');","await page.evaluate(() => document.querySelector('[data-action=\\\"restore-inspection-default\\\"]').click());")
          text=text.replace("await page.locator('[data-action=\"export-backup\"]').click();","await page.evaluate(() => document.querySelector('[data-action=\\\"export-backup\\\"]').click());")
          path.write_text(text,encoding='utf-8')
          PY

          OUT="$OUT" TEST_URL="http://127.0.0.1:8000/fast_track/v062.html?v=0628-ci" NODE_PATH="$PWD/node_modules" node .github/scripts/test_v0628.js

          DOCX="$OUT/Relatorio_Fast_Track_v0628.docx"
          PDF="$OUT/Relatorio_Fast_Track_v0628.pdf"
          test -s "$DOCX"
          test -s "$PDF"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 .github/scripts/validate_v0628.py docx
          pdftotext -layout "$PDF" "$OUT/pdf.txt"
          python3 .github/scripts/validate_v0628.py pdf
          pdfinfo "$PDF" > "$OUT/pdfinfo.txt"
          cat "$OUT/browser-result.json"
          cat "$OUT/pdfinfo.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0628-editable-narratives-validation-v6
          path: /tmp/v0628-validation
          if-no-files-found: warn

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/implement-v0628-editable-narratives.yml .github/workflows/implement-v0628-editable-narratives-v2.yml .github/workflows/implement-v0628-editable-narratives-v3.yml .github/workflows/implement-v0628-editable-narratives-v4.yml .github/workflows/implement-v0628-editable-narratives-v5.yml .github/workflows/implement-v0628-editable-narratives-v6.yml
          rm -f .github/scripts/patch_v0628.py .github/scripts/test_v0628.js .github/scripts/validate_v0628.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v062.html fast_track/v06.html fast_track/v06/direct.css fast_track/v06/direct-app.js fast_track/v06/direct-report.js fast_track/v06/direct-word.js .github
          git commit -m 'feat(v06): liberar narrativas editáveis e introdução documental'
          git push origin HEAD:feature/v062-editable-narratives-doc-intro
