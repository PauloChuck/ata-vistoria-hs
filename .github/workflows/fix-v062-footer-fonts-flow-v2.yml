name: Fix V062 footer fonts and page flow V2

on:
  push:
    branches:
      - fix/v062-footer-fonts-flow
    paths:
      - .github/workflows/fix-v062-footer-fonts-flow-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract implementation and validation scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-v062-footer-fonts-flow.yml').read_text(encoding='utf-8')

          def clean(chunk):
              lines = chunk.splitlines()
              result = []
              for line in lines:
                  result.append(line[10:] if line.startswith('          ') else line)
              return '\n'.join(result).strip('\n') + '\n'

          python_blocks = []
          cursor = 0
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          while True:
              try:
                  start = source.index(start_marker, cursor) + len(start_marker)
              except ValueError:
                  break
              end = source.index(end_marker, start)
              python_blocks.append(clean(source[start:end]))
              cursor = end + len(end_marker)

          if len(python_blocks) != 3:
              raise SystemExit(f'Esperados 3 blocos Python; encontrados {len(python_blocks)}')

          node_start_marker = "          cat > \"$OUT/test.js\" <<'NODE'\n"
          node_start = source.index(node_start_marker) + len(node_start_marker)
          node_end = source.index("\n          NODE", node_start)
          node_block = clean(source[node_start:node_end])

          Path('/tmp/patch.py').write_text(python_blocks[0],encoding='utf-8')
          Path('/tmp/test.js').write_text(node_block,encoding='utf-8')
          Path('/tmp/validate_docx.py').write_text(python_blocks[1],encoding='utf-8')
          Path('/tmp/validate_render.py').write_text(python_blocks[2],encoding='utf-8')
          PY

          python3 -m py_compile /tmp/patch.py /tmp/validate_docx.py /tmp/validate_render.py
          node --check /tmp/test.js

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/patch.py

          python3 - <<'PY'
          from pathlib import Path

          word_path=Path('fast_track/v06/direct-word.js')
          word=word_path.read_text(encoding='utf-8')
          old="      VerticalPositionAlign,TextWrappingType\n    } = d;"
          new="      VerticalPositionAlign,TextWrappingType,TableLayoutType\n    } = d;"
          if old not in word:
              raise SystemExit('Importação de TableLayoutType não localizada')
          word=word.replace(old,new,1)

          old="    const footerInfoTable = new Table({\n      width:{size:11907,type:WidthType.DXA},\n      indent:{size:-1701,type:WidthType.DXA},\n      borders:noBorder,"
          new="    const footerInfoTable = new Table({\n      width:{size:11907,type:WidthType.DXA},\n      indent:{size:-1701,type:WidthType.DXA},\n      layout:TableLayoutType.FIXED,\n      columnWidths:[1559,10348],\n      borders:noBorder,"
          if old not in word:
              raise SystemExit('Tabela do rodapé não localizada')
          word=word.replace(old,new,1)

          old="technical.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[damageHeader,...damageDataRows]}));"
          new="technical.push(new Table({width:{size:9072,type:WidthType.DXA},layout:TableLayoutType.FIXED,columnWidths:[635,3266,1089,907,1361,1814],rows:[damageHeader,...damageDataRows]}));"
          if old not in word:
              raise SystemExit('Tabela de danos não localizada')
          word=word.replace(old,new,1)

          old="new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[indemnityHeader,...indemnityDataRows]}),"
          new="new Table({width:{size:9072,type:WidthType.DXA},layout:TableLayoutType.FIXED,columnWidths:[635,3084,1542,1089,1361,1361],rows:[indemnityHeader,...indemnityDataRows]}),"
          if old not in word:
              raise SystemExit('Tabela do demonstrativo não localizada')
          word=word.replace(old,new,1)
          word_path.write_text(word,encoding='utf-8')

          validation=Path('/tmp/validate_render.py')
          text=validation.read_text(encoding='utf-8')
          text=text.replace("if pages_n>10: raise SystemExit(f'Word gerou páginas excessivas: {pages_n}')\n","")
          validation.write_text(text,encoding='utf-8')
          PY

          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          node --check fast_track/v06/direct-app.js
          grep -q 'report-footer-address' fast_track/v06/direct-report.js
          grep -q 'createFlowPaginator' fast_track/v06/direct-report.js
          grep -q 'width:22.2mm;height:16.5mm' fast_track/v06/direct.css
          grep -q 'font-family:Calibri' fast_track/v06/direct.css
          grep -q 'columnWidths:\[1559,10348\]' fast_track/v06/direct-word.js
          grep -q 'columnWidths:\[635,3266,1089,907,1361,1814\]' fast_track/v06/direct-word.js
          grep -q 'columnWidths:\[635,3084,1542,1089,1361,1361\]' fast_track/v06/direct-word.js
          grep -q 'PageNumber.TOTAL_PAGES' fast_track/v06/direct-word.js
          grep -q 'v=0625' fast_track/v062.html

      - name: Prepare browser and document tests
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Validate preview PDF Word footer fonts and flow
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-footer-flow
          mkdir -p "$OUT"
          cp /tmp/test.js "$OUT/test.js"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          OUT="$OUT" NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          rm -rf "$OUT/docx" && mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 /tmp/validate_docx.py

          OFFICE=$(command -v libreoffice || command -v soffice)
          mkdir -p "$OUT/lo-profile" "$OUT/render"
          "$OFFICE" -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          WORDPDF=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$WORDPDF"
          pdfinfo "$WORDPDF" > "$OUT/render/pdfinfo.txt"
          pdftotext -layout "$WORDPDF" "$OUT/render/document.txt"
          pdftotext -bbox-layout "$WORDPDF" "$OUT/render/document-bbox.html"
          pdftoppm -png -r 120 "$WORDPDF" "$OUT/render/page" >/dev/null 2>&1
          python3 /tmp/validate_render.py

          cat "$OUT/browser-result.json"
          cat "$OUT/docx-structure.json"
          cat "$OUT/render/validation-summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v062-footer-fonts-flow-validation
          path: /tmp/v062-footer-flow
          if-no-files-found: warn

      - name: Commit validated adjustment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v062-footer-fonts-flow.yml .github/workflows/fix-v062-footer-fonts-flow-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-report.js fast_track/v06/direct-word.js fast_track/v06/direct.css fast_track/v062.html fast_track/v06.html .github/workflows/fix-v062-footer-fonts-flow.yml .github/workflows/fix-v062-footer-fonts-flow-v2.yml
          git commit -m 'fix(v06): ajustar rodapé fontes e fluxo de páginas'
          git push origin HEAD:fix/v062-footer-fonts-flow
