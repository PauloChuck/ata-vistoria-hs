name: Diagnose V0633 payload

on:
  push:
    branches:
      - feature/v0633-six-base-importer
    paths:
      - .github/workflows/diagnose-v0633.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0633-six-base-importer
      - name: Inspect recovered TAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, io, struct, tarfile, zlib

          root=Path('.github/v0633-payload')
          read=lambda n:(root/n).read_text(encoding='utf-8').strip()
          encoded=(
              read('part-00')+read('part-01')+read('part-02')+
              read('fix-03-0')+read('fix-03b-0')+read('fix-03b-1')+
              read('part-04')+read('part-05')+
              read('fix-06-0')+read('fix-06-1')+
              read('fix-07-0')+read('fix-07-1')+
              read('fix-08-0')+read('fix-08-1')
          )
          raw=base64.b64decode(encoded,validate=True)
          flags=raw[3]
          pos=10
          if flags & 4:
              xlen=struct.unpack_from('<H',raw,pos)[0]; pos+=2+xlen
          if flags & 8: pos=raw.index(b'\0',pos)+1
          if flags & 16: pos=raw.index(b'\0',pos)+1
          if flags & 2: pos+=2
          payload=zlib.decompress(raw[pos:-8],-zlib.MAX_WBITS)
          stored_crc,stored_size=struct.unpack('<II',raw[-8:])
          delta=stored_size-len(payload)
          payload+=b'\0'*max(0,delta)
          print('raw bytes',len(raw),'payload',len(payload),'delta',delta)
          print('crc stored/calculated',f'{stored_crc:08x}',f'{binascii.crc32(payload[:stored_size-delta])&0xffffffff:08x}')
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:') as tar:
              members=tar.getmembers()
              print('members',len(members))
              for member in members:
                  print(repr(member.name),member.size,member.type)
                  if member.isfile() and member.size < 200000:
                      blob=tar.extractfile(member).read()
                      if member.name.endswith(('.js','.html','.css','.json','.yml','.yaml')):
                          print('  head:',blob[:120].decode('utf-8','replace').replace('\n','\\n'))
          PY
