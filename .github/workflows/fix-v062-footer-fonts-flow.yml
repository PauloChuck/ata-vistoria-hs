      - name: Prepare browser and document tests
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Validate preview PDF Word footer fonts and flow
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-footer-flow
          mkdir -p "$OUT"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat > "$OUT/test.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const svgData=(label,bg='#e8eef1')=>`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="${bg}"/><path d="M40 700 L1160 100" stroke="#777" stroke-width="35"/><text x="80" y="150" font-family="Arial" font-size="55">${label}</text></svg>`)}`;
          const makeDamage=i=>({id:`d${i}`,description:i%3===0?`Item ${i} — descrição técnica extensa para verificar a quebra de linha e a continuidade da tabela sem espaços vazios artificiais`:`Item ${i} — material danificado apurado em vistoria`,quantity:String(i*7.5),unit:i%2?'un.':'m²',age:String((i%8)+1),ageUnit:i%4?'anos':'meses',claimedTotal:String(900+i*173.45),assessedTotal:String(850+i*163.25)});
          const baseFields={
            insurerClaim:'1325000',hsClaim:'S2609000',insurer:'SOMPO SEGUROS S/A',insured:'COOPERATIVA CENTRAL AURORA ALIMENTOS',claimantName:'Cooperado Teste de Fluxo',claimantCpf:'000.000.000-00',riskAddress:'Linha Teste, Município/SC',policyNumber:'9600131927',productName:'RISCOS NOMEADOS',broker:'ALPER CONSULTORIA E CORRETORA DE SEGUROS S/A',lossDate:'2026-11-04',coverageName:'Vendaval / Granizo',inspectionDate:'2026-11-10',regulatorOpinion:'Diante do exposto, o sinistro está amparado pela cobertura de Vendaval/Granizo da apólice. '.repeat(18),otherInsurance:'nao',otherInsuranceDetails:'',bankName:'CRESOL',bankAgency:'02508',bankAccount:'001.801-5',noticeDate:'2026-11-05',scheduleDate:'2026-11-06',reportCity:'Blumenau (SC)',reportDate:'2026-11-10',regulatorName:'Paulo R. Schlosser',regulatorCpf:'068.613.739-66',noDocuments:false,mapFit:'contain',mapPosX:'50',mapPosY:'50'
          };
          const signature=svgData('assinatura','#ffffff');
          const state={version:'0.6.2',fields:baseFields,map:{dataUrl:svgData('Mapa de localização'),name:'mapa.svg',fit:'contain',posX:'50',posY:'50'},damages:Array.from({length:14},(_,i)=>makeDamage(i+1)),photos:Array.from({length:6},(_,i)=>({id:`p${i}`,name:`foto-${i+1}.svg`,dataUrl:svgData(`Fotografia ${i+1}`,i%2?'#dfe9d9':'#e5e3ef'),caption:`Evidência fotográfica ${i+1} do dano vistoriado`})),documents:Array.from({length:15},(_,i)=>({id:`doc${i}`,name:`documento-${i+1}.txt`,type:`Documento ${i+1}`,description:`Descrição do documento ${i+1} apresentado para análise`,mime:'text/plain',dataUrl:'data:text/plain;base64,VEVTVEU='})),signatures:{regulator:signature,claimant:signature},finalizedAt:null};

          (async()=>{
            const out=process.env.OUT;
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1600,height:1200}});
            const errors=[]; const http=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400&&!/favicon\.ico/i.test(r.url()))http.push({status:r.status(),url:r.url()});});
            page.on('dialog',async d=>d.accept());
            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=0625-ci',{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell');
            await page.setInputFiles('#backupInput',{name:'fluxo.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(state))});
            await page.waitForFunction(()=>document.querySelectorAll('#damageList .damage-card').length===14,{timeout:30000});
            await page.evaluate(()=>document.querySelector('.screen[data-step="6"] [data-go="7"]').click());
            await page.waitForSelector('.screen[data-step="7"].active');
            await page.waitForSelector('#reportPreview .report-page');

            const preview=await page.evaluate(()=>{
              const mm=px=>px*25.4/96;
              const pages=[...document.querySelectorAll('#reportPreview .report-page')];
              const details=pages.map((p,index)=>{
                const pr=p.getBoundingClientRect();
                const content=p.querySelector('.report-content');
                const cr=content.getBoundingClientRect();
                const mark=p.querySelector('.report-footer-mark');
                const addr=p.querySelector('.report-footer-address');
                const contact=p.querySelector('.report-footer-contact');
                const num=p.querySelector('.report-page-number');
                const mr=mark.getBoundingClientRect(), ar=addr.getBoundingClientRect(), cor=contact.getBoundingClientRect(), nr=num.getBoundingClientRect();
                const css=e=>getComputedStyle(e);
                return {page:index+1,overflow:content.scrollHeight-content.clientHeight,contentBottom:mm(cr.bottom-pr.top),footer:{mark:{left:mm(mr.left-pr.left),top:mm(mr.top-pr.top),width:mm(mr.width),height:mm(mr.height)},address:{top:mm(ar.top-pr.top),font:css(addr).fontFamily,size:css(addr).fontSize,color:css(addr).color,weight:css(addr).fontWeight,style:css(addr).fontStyle},contact:{top:mm(cor.top-pr.top)},number:{right:mm(pr.right-nr.right),top:mm(nr.top-pr.top),font:css(num).fontFamily,size:css(num).fontSize,color:css(num).color,style:css(num).fontStyle,text:num.textContent.trim()}},photos:p.querySelectorAll('.photo-cell-report').length,damageRows:p.querySelectorAll('.damage-table tbody tr').length,indemnityRows:p.querySelectorAll('.indemnity-table tbody tr').length,text:p.innerText};
              });
              const sample={title:cssInfo('.doc-title'),subtitle:cssInfo('.doc-subtitle'),claim:cssInfo('.claim-table'),meta:cssInfo('.meta-table td'),body:cssInfo('.doc-text'),heading:cssInfo('.doc-section'),subheading:cssInfo('.doc-subsection'),caption:cssInfo('.doc-caption')};
              function cssInfo(selector){const e=document.querySelector(`#reportPreview ${selector}`);if(!e)return null;const c=getComputedStyle(e);return{font:c.fontFamily,size:c.fontSize,line:c.lineHeight,color:c.color,weight:c.fontWeight};}
              return {details,sample,pageCount:pages.length};
            });
            const near=(a,b,t=.45)=>Math.abs(a-b)<=t;
            if(preview.pageCount>10) throw new Error(`Paginação ainda excessiva: ${preview.pageCount}`);
            let damageTotal=0, indemnityTotal=0;
            for(const item of preview.details){
              if(item.overflow>2) throw new Error(`Overflow na página ${item.page}: ${item.overflow}`);
              if(item.contentBottom>268) throw new Error(`Corpo aproximou-se do rodapé na página ${item.page}: ${item.contentBottom} mm`);
              if(!near(item.footer.mark.left,0)||!near(item.footer.mark.top,272.4)||!near(item.footer.mark.width,22.2)||!near(item.footer.mark.height,16.5)) throw new Error(`Símbolo do rodapé fora do padrão: ${JSON.stringify(item.footer.mark)}`);
              if(!near(item.footer.address.top,275.9)||!near(item.footer.contact.top,282.4)||!near(item.footer.number.top,291.4)) throw new Error(`Posições do rodapé fora do padrão: ${JSON.stringify(item.footer)}`);
              if(!/Calibri/i.test(item.footer.address.font)||item.footer.address.size!=='13.3333px'||item.footer.address.color!=='rgb(41, 168, 224)'||item.footer.address.style!=='normal') throw new Error(`Tipografia do rodapé inválida: ${JSON.stringify(item.footer.address)}`);
              if(!/Arial/i.test(item.footer.number.font)||item.footer.number.size!=='13.3333px'||item.footer.number.color!=='rgb(0, 0, 0)'||item.footer.number.style!=='italic') throw new Error(`Paginação inválida: ${JSON.stringify(item.footer.number)}`);
              const [current,total]=item.footer.number.text.split(' de ').map(Number);
              if(current!==item.page||total!==preview.pageCount) throw new Error(`Numeração incoerente: ${item.footer.number.text}`);
              if(item.photos>4) throw new Error(`Mais de quatro fotos na página ${item.page}`);
              damageTotal+=item.damageRows; indemnityTotal+=item.indemnityRows;
            }
            if(damageTotal!==14||indemnityTotal!==14) throw new Error(`Linhas incompletas: danos=${damageTotal}, demonstrativo=${indemnityTotal}`);
            const s=preview.sample;
            const checks=[['title',s.title,'37.3333px'],['subtitle',s.subtitle,'32px'],['claim',s.claim,'14.6667px'],['meta',s.meta,'16px'],['body',s.body,'14.6667px'],['heading',s.heading,'18.6667px'],['subheading',s.subheading,'16px'],['caption',s.caption,'13.3333px']];
            for(const [name,val,size] of checks){if(!val||val.size!==size)throw new Error(`Tamanho ${name} incorreto: ${JSON.stringify(val)}`);}
            if(!/Arial Black/i.test(s.title.font)||!/Arial Black/i.test(s.heading.font)||!/Arial/i.test(s.body.font)) throw new Error(`Hierarquia de fontes incorreta: ${JSON.stringify(s)}`);
            const combined=preview.details.some(d=>d.text.includes('5. PARECER DO REGULADOR')&&d.text.includes('6. DEMONSTRATIVO DE INDENIZAÇÃO'));
            if(!combined) throw new Error('O fluxo não aproveitou uma página para seções consecutivas no cenário de teste');

            await page.locator('#reportPreview').screenshot({path:path.join(out,'preview-completo.png'),fullPage:true});
            await page.locator('#reportPreview .report-page').first().screenshot({path:path.join(out,'preview-capa.png')});
            await page.locator('#reportPreview .report-page').last().screenshot({path:path.join(out,'preview-final.png')});

            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            await page.emulateMedia({media:'print'});
            await page.pdf({path:path.join(out,'Relatorio_Fast_Track_fluxo.pdf'),format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const downloadPromise=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await downloadPromise;
            const docxPath=path.join(out,download.suggestedFilename());
            await download.saveAs(docxPath);
            if(!fs.existsSync(docxPath)||fs.statSync(docxPath).size<20000) throw new Error('DOCX inválido');
            if(errors.length||http.length) throw new Error(JSON.stringify({errors,http}));
            fs.writeFileSync(path.join(out,'browser-result.json'),JSON.stringify({preview,docxPath,docxBytes:fs.statSync(docxPath).size},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          OUT="$OUT" NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          rm -rf "$OUT/docx" && mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"

          python3 - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          root=Path('/tmp/v062-footer-flow/docx')
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','wp':'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing'}
          W='{%s}'%ns['w']
          expected_mark=(799200,594000)
          footers=[]
          for name in ['footer1.xml','footer2.xml']:
              path=root/'word'/name
              tree=ET.parse(path).getroot()
              images=tree.findall('.//wp:inline',ns)
              if len(images)!=1: raise SystemExit(f'{name}: símbolo duplicado ou ausente: {len(images)}')
              ext=images[0].find('wp:extent',ns)
              dims=(int(ext.attrib['cx']),int(ext.attrib['cy']))
              if any(abs(a-b)>100 for a,b in zip(dims,expected_mark)): raise SystemExit(f'{name}: dimensão do símbolo {dims}')
              xml=path.read_text(encoding='utf-8')
              if 'PAGE' not in xml or 'NUMPAGES' not in xml: raise SystemExit(f'{name}: campos PAGE/NUMPAGES ausentes')
              if '29A8E0' not in xml or 'Calibri' not in xml or 'w:sz w:val="20"' not in xml: raise SystemExit(f'{name}: tipografia institucional ausente')
              tbl=tree.find('.//w:tbl',ns); tblpr=tbl.find('w:tblPr',ns)
              tblw=tblpr.find('w:tblW',ns); ind=tblpr.find('w:tblInd',ns)
              if tblw is None or tblw.attrib.get(W+'w')!='11907': raise SystemExit(f'{name}: largura do rodapé incorreta')
              if ind is None or ind.attrib.get(W+'w')!='-1701': raise SystemExit(f'{name}: recuo do rodapé incorreto')
              footers.append({'name':name,'mark':dims,'pageFields':True})

          document=(root/'word/document.xml').read_text(encoding='utf-8')
          settings=(root/'word/settings.xml').read_text(encoding='utf-8')
          styles=(root/'word/styles.xml').read_text(encoding='utf-8')
          page_breaks=len(re.findall(r'<w:br[^>]+w:type="page"',document))
          if page_breaks>3: raise SystemExit(f'Quebras manuais excessivas: {page_breaks}')
          if document.count('<w:tblHeader')<2: raise SystemExit('Cabeçalhos repetidos das tabelas não configurados')
          if document.count('<w:cantSplit')<20: raise SystemExit('Linhas indivisíveis insuficientes')
          if 'w:ascii="Arial"' not in styles and 'w:asciiTheme' not in styles: raise SystemExit('Fonte padrão Arial não localizada')
          if 'w:pgMar w:top="284" w:right="1134" w:bottom="284" w:left="1701" w:header="57" w:footer="0"' not in document: raise SystemExit('Margens/cabeçalho/rodapé divergentes')
          (Path('/tmp/v062-footer-flow')/'docx-structure.json').write_text(json.dumps({'footers':footers,'pageBreaks':page_breaks,'tableHeaders':document.count('<w:tblHeader'),'cantSplit':document.count('<w:cantSplit')},indent=2),encoding='utf-8')
          PY

          OFFICE=$(command -v libreoffice || command -v soffice)
          mkdir -p "$OUT/lo-profile" "$OUT/render"
          "$OFFICE" -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          WORDPDF=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$WORDPDF"
          pdfinfo "$WORDPDF" > "$OUT/render/pdfinfo.txt"
          pdftotext -layout "$WORDPDF" "$OUT/render/document.txt"
          pdftotext -bbox-layout "$WORDPDF" "$OUT/render/document-bbox.html"
          pdftoppm -png -r 120 "$WORDPDF" "$OUT/render/page" >/dev/null 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          out=Path('/tmp/v062-footer-flow/render')
          info=(out/'pdfinfo.txt').read_text(encoding='utf-8',errors='ignore')
          pages_n=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          if pages_n>10: raise SystemExit(f'Word gerou páginas excessivas: {pages_n}')
          text=(out/'document.txt').read_text(encoding='utf-8',errors='ignore')
          pages=[p for p in text.split('\f') if p.strip()]
          if len(pages)!=pages_n: raise SystemExit(f'Páginas textuais {len(pages)} != {pages_n}')
          address='Matriz - Rua XV de novembro 1336, salas 34 e 35 – Blumenau – SC – CEP 89010-903'
          for i,page in enumerate(pages,1):
              if address not in page or 'www.horizonservitas.com +55 47 3326-1844' not in page: raise SystemExit(f'Rodapé ausente na página {i}')
              if f'{i} de {pages_n}' not in page: raise SystemExit(f'Numeração dinâmica ausente na página {i}')
              if len(page.strip())<120: raise SystemExit(f'Página possivelmente vazia: {i}')
          root=ET.parse(out/'document-bbox.html').getroot(); ns={'x':'http://www.w3.org/1999/xhtml'}
          gaps=[]
          for i,page in enumerate(root.findall('.//x:page',ns),1):
              words=page.findall('.//x:word',ns)
              matriz=[w for w in words if (w.text or '').strip()=='Matriz']
              if not matriz: raise SystemExit(f'Matriz não localizada no bbox da página {i}')
              footer_y=min(float(w.attrib['yMin']) for w in matriz)
              body=[]
              for w in words:
                  value=(w.text or '').strip()
                  if not value: continue
                  y=float(w.attrib['yMax'])
                  if y<footer_y-1: body.append(y)
              gap=footer_y-max(body) if body else footer_y
              if gap<5: raise SystemExit(f'Conteúdo aproximou-se do rodapé na página {i}: {gap:.2f} pt')
              gaps.append(round(gap,2))
          (out/'validation-summary.txt').write_text(f'Páginas: {pages_n}\nFolgas texto/rodapé (pt): {gaps}\n',encoding='utf-8')
          PY

          cat "$OUT/browser-result.json"
          cat "$OUT/docx-structure.json"
          cat "$OUT/render/validation-summary.txt"

