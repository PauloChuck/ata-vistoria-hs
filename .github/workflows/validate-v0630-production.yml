name: Validate V0630 production

on:
  push:
    branches:
      - feature/v0630-parecer-evidencias-reset
    paths:
      - .github/workflows/validate-v0630-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check fast_track/v06/direct-app-0630.js
          node --check fast_track/v06/direct-layout-0630.js
          node --check fast_track/v06/direct-word-0630.js
          grep -q 'direct-app-0630.js?v=0630' fast_track/v062.html
          grep -q 'direct-layout-0630.js?v=0630' fast_track/v062.html
          grep -q 'direct-word-0630.js?v=0630' fast_track/v062.html
          grep -q 'id="causeEvidenceInput"' fast_track/v062.html
          grep -q 'id="causeEvidenceList"' fast_track/v062.html
          grep -q 'id="addPhotoButton"' fast_track/v062.html
          ! grep -q 'id="documentInput"' fast_track/v062.html
          ! grep -q 'id="documentList"' fast_track/v062.html
          ! grep -q 'id="noDocuments"' fast_track/v062.html
          ! grep -qi 'LEVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-layout-0630.js
          ! grep -qi 'DADOS CADASTRAIS' fast_track/v06/direct-layout-0630.js
          ! grep -qi 'LEVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-word-0630.js
          ! grep -qi 'DADOS CADASTRAIS' fast_track/v06/direct-word-0630.js

      - name: Prepare browser and document tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0630-node /tmp/v0630-validation
          cd /tmp/v0630-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Functional browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0630-validation
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat > "$OUT/test.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const pngBase64='iVBORw0KGgoAAAANSUhEUgAAAAgAAAAGCAIAAABxZ0isAAAAFElEQVR4nGMMWHCHARtgwipKJwkADY0B2N/GZccAAAAASUVORK5CYII=';
          const pngBuffer=Buffer.from(pngBase64,'base64');
          const pngDataUrl=`data:image/png;base64,${pngBase64}`;
          const pdfBuffer=Buffer.from('%PDF-1.4\n1 0 obj<< /Type /Catalog >>endobj\ntrailer<< /Root 1 0 R >>\n%%EOF\n');
          const pdfDataUrl=`data:application/pdf;base64,${pdfBuffer.toString('base64')}`;

          const fields={
            insurerClaim:'1326300',hsClaim:'S2609630',insurer:'SOMPO SEGUROS S/A',insured:'COOPERATIVA CENTRAL AURORA ALIMENTOS',claimantName:'Cooperado Teste V0630',claimantCpf:'012.345.678-90',riskAddress:'Linha Teste, Município/SC',policyNumber:'9600131927',productName:'RISCOS NOMEADOS',broker:'ALPER CONSULTORIA E CORRETORA DE SEGUROS S/A',lossDate:'2026-11-04',coverageName:'Vendaval / Granizo',inspectionDate:'2026-11-10',occurrenceNarrative:'No dia 04 de novembro de 2026, ocorreu tempestade severa na região.',occurrenceNarrativeMode:'custom',occurrenceNarrativeDate:'2026-11-04',inspectionNarrative:'Em vistoria presencial realizada no dia 10 de novembro de 2026, foram constatados os danos descritos.',inspectionNarrativeMode:'custom',inspectionNarrativeDate:'2026-11-10',mapFit:'contain',mapPosX:'50',mapPosY:'50',regulatorOpinion:'Diante do exposto, o conjunto probatório confirma o nexo causal e o sinistro está amparado pela cobertura contratada.',otherInsurance:'nao',otherInsuranceDetails:'',bankName:'BANCO TESTE NÃO EXIBIR',bankAgency:'0001',bankAccount:'000123-4',noticeDate:'2026-11-05',scheduleDate:'2026-11-06',reportCity:'Blumenau (SC)',reportDate:'2026-11-10',regulatorName:'Paulo R. Schlosser',regulatorCpf:'068.613.739-66',noDocuments:true
          };

          function backup({withEvidence=true}={}){
            return {
              version:'0.6.10',updatedAt:new Date().toISOString(),finalizedAt:null,fields:{...fields},
              map:{dataUrl:pngDataUrl,name:'mapa.png',fit:'contain',posX:'50',posY:'50'},
              damages:[
                {id:'damage_1',description:'Telhas e componentes de cobertura com descrição extensa para validar o fluxo',quantity:'120',unit:'un.',age:'4',ageUnit:'anos',claimedTotal:'10000',assessedTotal:'9500'},
                {id:'damage_2',description:'Cortinado lateral',quantity:'220',unit:'m²',age:'2',ageUnit:'anos',claimedTotal:'6480',assessedTotal:'6480'}
              ],
              photos:[{id:'photo_1',name:'vistoria.png',caption:'Danos observados em vistoria',dataUrl:pngDataUrl}],
              documents:[{id:'legacy_doc',name:'documento-antigo.pdf',type:'Laudo antigo',description:'Não deve reaparecer nem migrar',mime:'application/pdf',dataUrl:pdfDataUrl}],
              causeEvidence:withEvidence ? [
                {id:'evidence_1',name:'foto-causa.png',mime:'image/png',dataUrl:pngDataUrl,caption:'Fotografia da causa'},
                {id:'evidence_2',name:'laudo-causa.pdf',mime:'application/pdf',dataUrl:pdfDataUrl,caption:'Laudo técnico principal'}
              ] : undefined,
              signatures:{regulator:null,claimant:null}
            };
          }

          async function go(page,step){
            await page.evaluate((target)=>{
              const active=document.querySelector('.screen.active');
              const button=active?.querySelector(`[data-go="${target}"]`);
              if(!button) throw new Error(`Botão para etapa ${target} não encontrado`);
              button.click();
            },step);
            await page.waitForSelector(`.screen[data-step="${step}"].active`);
          }

          async function importBackup(page,data,name='backup.json'){
            await page.setInputFiles('#backupInput',{name,mimeType:'application/json',buffer:Buffer.from(JSON.stringify(data))});
            await page.waitForTimeout(900);
          }

          (async()=>{
            const out='/tmp/v0630-validation';
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const pageErrors=[]; const httpErrors=[]; const consoleErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            page.on('console',msg=>{if(msg.type()==='error') consoleErrors.push(msg.text())});
            page.on('response',response=>{if(response.status()>=400&&!/favicon\.ico/i.test(response.url()))httpErrors.push({status:response.status(),url:response.url()})});
            page.on('dialog',dialog=>dialog.accept());

            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=0630-ci',{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible'});

            const structure=await page.evaluate(()=>({
              report:Boolean(window.FastTrackV06Report),word:Boolean(window.FastTrackV06Word),docx:Boolean(window.docx),
              documentsInput:Boolean(document.getElementById('documentInput')),documentsList:Boolean(document.getElementById('documentList')),noDocuments:Boolean(document.getElementById('noDocuments')),
              evidenceInput:Boolean(document.getElementById('causeEvidenceInput')),evidenceList:Boolean(document.getElementById('causeEvidenceList')),
              opinionCount:document.querySelectorAll('#regulatorOpinion').length,
              addPhotoAfterGallery:Boolean(document.getElementById('photoGallery').compareDocumentPosition(document.getElementById('addPhotoButton')) & Node.DOCUMENT_POSITION_FOLLOWING),
              cadastroFields:['bankName','bankAgency','bankAccount'].every(id=>Boolean(document.getElementById(id)))
            }));
            if(!structure.report||!structure.word||!structure.docx||structure.documentsInput||structure.documentsList||structure.noDocuments||!structure.evidenceInput||!structure.evidenceList||structure.opinionCount!==1||!structure.addPhotoAfterGallery||!structure.cadastroFields){
              throw new Error(`Estrutura inicial inválida: ${JSON.stringify(structure)}`);
            }
            if(/Levantamentos documentais/i.test(await page.locator('body').innerText())) throw new Error('Levantamentos Documentais ainda aparece no formulário.');

            // Salva uma sessão e confirma que recarregar limpa fotos/danos/apuração, mas preserva evidências e demais campos.
            await page.click('[data-action="load-example"]');
            await page.setInputFiles('#photoInput',{name:'foto-sessao.png',mimeType:'image/png',buffer:pngBuffer});
            await page.waitForSelector('#photoGallery .photo-card');
            await page.fill('#photoGallery [data-photo-caption]','Foto temporária da sessão');
            await page.setInputFiles('#causeEvidenceInput',{name:'evidencia-sessao.png',mimeType:'image/png',buffer:pngBuffer});
            await page.waitForSelector('#causeEvidenceList .cause-evidence-card');
            await page.fill('#causeEvidenceList [data-evidence-caption]','Evidência persistente');
            await page.evaluate(()=>document.querySelector('[data-action="save-draft"]').click());
            await page.waitForTimeout(1200);
            const beforeReload=await page.evaluate(()=>({photos:document.querySelectorAll('#photoGallery .photo-card').length,damages:document.querySelectorAll('#damageList .damage-card').length,evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length}));
            if(beforeReload.photos!==1||beforeReload.damages!==3||beforeReload.evidence!==1) throw new Error(`Preparação para recarga inválida: ${JSON.stringify(beforeReload)}`);

            await page.reload({waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible'});
            const reset=await page.evaluate(()=>({
              photos:document.querySelectorAll('#photoGallery .photo-card').length,
              damages:document.querySelectorAll('#damageList .damage-card').length,
              evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length,
              claimant:document.getElementById('claimantName').value,
              financial:document.getElementById('financialSummary').innerText.replace(/\s+/g,' ')
            }));
            if(reset.photos!==0||reset.damages!==0||reset.evidence!==1||reset.claimant!=='Cooperado Exemplo'||!/R\$\s*0,00/.test(reset.financial)) throw new Error(`Limpeza na recarga falhou: ${JSON.stringify(reset)}`);

            await page.reload({waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible'});
            const secondReset=await page.evaluate(()=>({photos:document.querySelectorAll('#photoGallery .photo-card').length,damages:document.querySelectorAll('#damageList .damage-card').length,evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length}));
            if(secondReset.photos!==0||secondReset.damages!==0||secondReset.evidence!==1) throw new Error(`Dados limpos foram restaurados: ${JSON.stringify(secondReset)}`);

            // Backup antigo é aceito, mas documentos legados não aparecem nem migram.
            await importBackup(page,backup({withEvidence:false}),'backup-antigo.json');
            const legacy=await page.evaluate(()=>({photos:document.querySelectorAll('#photoGallery .photo-card').length,damages:document.querySelectorAll('#damageList .damage-card').length,evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length,oldDocumentVisible:document.body.innerText.includes('documento-antigo.pdf')}));
            if(legacy.photos!==1||legacy.damages!==2||legacy.evidence!==0||legacy.oldDocumentVisible) throw new Error(`Compatibilidade antiga inválida: ${JSON.stringify(legacy)}`);

            // Importação explícita atual preserva os três conjuntos durante a sessão.
            await importBackup(page,backup(),'backup-atual.json');
            await go(page,2); await go(page,3); await go(page,4);
            let session=await page.evaluate(()=>({photos:document.querySelectorAll('#photoGallery .photo-card').length,damages:document.querySelectorAll('#damageList .damage-card').length,evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length,buttonAfter:Boolean(document.getElementById('photoGallery').compareDocumentPosition(document.getElementById('addPhotoButton')) & Node.DOCUMENT_POSITION_FOLLOWING)}));
            if(session.photos!==1||session.damages!==2||session.evidence!==2||!session.buttonAfter) throw new Error(`Importação explícita inválida: ${JSON.stringify(session)}`);

            // Visualizar, substituir e remover evidências.
            await page.evaluate(()=>{window.__evidenceOpened='';window.open=(url)=>{window.__evidenceOpened=url;return null}});
            await page.locator('#causeEvidenceList [data-action="view-evidence"]').first().click();
            if(!(await page.evaluate(()=>String(window.__evidenceOpened||'').startsWith('data:')))) throw new Error('Visualização da evidência não abriu o conteúdo armazenado.');
            const chooserPromise=page.waitForEvent('filechooser');
            await page.locator('#causeEvidenceList [data-action="replace-evidence"]').nth(1).click();
            const chooser=await chooserPromise;
            await chooser.setFiles({name:'laudo-substituto.pdf',mimeType:'application/pdf',buffer:pdfBuffer});
            await page.waitForFunction(()=>document.querySelector('#causeEvidenceList').innerText.includes('laudo-substituto.pdf'));
            await page.locator('#causeEvidenceList [data-action="remove-evidence"]').nth(1).click();
            await page.waitForFunction(()=>document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length===1);
            await page.setInputFiles('#causeEvidenceInput',{name:'laudo-causa.pdf',mimeType:'application/pdf',buffer:pdfBuffer});
            await page.waitForFunction(()=>document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length===2);
            await page.locator('#causeEvidenceList [data-evidence-caption]').nth(1).fill('Laudo técnico principal');

            // Inclusão sucessiva mantém o botão no final da galeria.
            await page.setInputFiles('#photoInput',{name:'vistoria-adicional.png',mimeType:'image/png',buffer:pngBuffer});
            await page.waitForFunction(()=>document.querySelectorAll('#photoGallery .photo-card').length===2);
            await page.locator('#photoGallery [data-photo-caption]').nth(1).fill('Segunda fotografia da vistoria');
            const photoFlow=await page.evaluate(()=>({count:document.querySelectorAll('#photoGallery .photo-card').length,buttonAfter:Boolean(document.getElementById('photoGallery').compareDocumentPosition(document.getElementById('addPhotoButton')) & Node.DOCUMENT_POSITION_FOLLOWING)}));
            if(photoFlow.count!==2||!photoFlow.buttonAfter) throw new Error(`Fluxo das fotos inválido: ${JSON.stringify(photoFlow)}`);

            await go(page,5); await go(page,4);
            session=await page.evaluate(()=>({photos:document.querySelectorAll('#photoGallery .photo-card').length,damages:document.querySelectorAll('#damageList .damage-card').length,evidence:document.querySelectorAll('#causeEvidenceList .cause-evidence-card').length}));
            if(session.photos!==2||session.damages!==2||session.evidence!==2) throw new Error(`Navegação perdeu dados: ${JSON.stringify(session)}`);
            await go(page,5); await go(page,6); await go(page,7);
            await page.waitForSelector('#reportPreview .report-page');

            const preview=await page.evaluate(()=>{
              const root=document.getElementById('reportPreview');
              const text=root.innerText;
              return {text,opinionCount:(text.match(/4\.2\. PARECER DO REGULADOR/g)||[]).length,evidenceImages:root.querySelectorAll('.cause-evidence-report-image').length,pages:root.querySelectorAll('.report-page').length,overflows:[...root.querySelectorAll('.report-content')].map(el=>el.scrollHeight-el.clientHeight)};
            });
            for(const value of ['LEVANTAMENTOS DOCUMENTAIS','DADOS CADASTRAIS','documento-antigo.pdf','BANCO TESTE NÃO EXIBIR']) if(preview.text.includes(value)) throw new Error(`Conteúdo removido ainda aparece: ${value}`);
            for(const value of ['4.2. PARECER DO REGULADOR','EVIDÊNCIAS DA CAUSA','Fotografia da causa','laudo-causa.pdf','Laudo técnico principal','5. DEMONSTRATIVO DE INDENIZAÇÃO','6. DECLARAÇÃO DE OUTROS SEGUROS','7. CRONOLOGIA','8. INFORMAÇÕES COMPLEMENTARES']) if(!preview.text.includes(value)) throw new Error(`Conteúdo ausente: ${value}`);
            if(preview.opinionCount!==1||preview.evidenceImages<1||preview.overflows.some(value=>value>2)) throw new Error(`Prévia inválida: ${JSON.stringify(preview)}`);
            await page.locator('#reportPreview .report-page').filter({hasText:'4.2. PARECER DO REGULADOR'}).first().screenshot({path:path.join(out,'preview-parecer-evidencias.png')});

            await page.evaluate(()=>{window.print=()=>{window.__printed=true}});
            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            const printText=await page.locator('#printHost').innerText();
            for(const value of ['LEVANTAMENTOS DOCUMENTAIS','DADOS CADASTRAIS','documento-antigo.pdf','BANCO TESTE NÃO EXIBIR']) if(printText.includes(value)) throw new Error(`Conteúdo removido na impressão: ${value}`);
            await page.emulateMedia({media:'print'});
            await page.pdf({path:path.join(out,'Relatorio_Fast_Track_v0630_browser.pdf'),format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const pending=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await pending;
            const docxPath=path.join(out,download.suggestedFilename());
            await download.saveAs(docxPath);
            if(!fs.existsSync(docxPath)||fs.statSync(docxPath).size<15000) throw new Error(`DOCX inválido: ${docxPath}`);

            if(pageErrors.length||httpErrors.length||consoleErrors.length) throw new Error(JSON.stringify({pageErrors,httpErrors,consoleErrors}));
            fs.writeFileSync(path.join(out,'result.json'),JSON.stringify({structure,beforeReload,reset,secondReset,legacy,session,photoFlow,preview:{opinionCount:preview.opinionCount,evidenceImages:preview.evidenceImages,pages:preview.pages,overflows:preview.overflows},docxPath,docxBytes:fs.statSync(docxPath).size},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

          NODE_PATH=/tmp/v0630-node/node_modules node "$OUT/test.js"

      - name: Validate Word and PDF contents
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0630-validation
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          BROWSER_PDF="$OUT/Relatorio_Fast_Track_v0630_browser.pdf"
          test -n "$DOCX" && test -s "$DOCX" && test -s "$BROWSER_PDF"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/render" "$OUT/lo-profile"
          unzip -q "$DOCX" -d "$OUT/docx"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          WORD_PDF=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$WORD_PDF"
          pdftotext -layout "$BROWSER_PDF" "$OUT/browser.txt"
          pdftotext -layout "$WORD_PDF" "$OUT/word.txt"
          unzip -p "$DOCX" word/document.xml > "$OUT/document.xml"

          for TEXT in "$OUT/browser.txt" "$OUT/word.txt"; do
            grep -q '4.2. PARECER DO REGULADOR' "$TEXT"
            grep -q 'EVIDÊNCIAS DA CAUSA' "$TEXT"
            grep -q 'laudo-causa.pdf' "$TEXT"
            grep -q 'Laudo técnico principal' "$TEXT"
            grep -q '5. DEMONSTRATIVO DE INDENIZAÇÃO' "$TEXT"
            grep -q '6. DECLARAÇÃO DE OUTROS SEGUROS' "$TEXT"
            grep -q '7. CRONOLOGIA' "$TEXT"
            grep -q '8. INFORMAÇÕES COMPLEMENTARES' "$TEXT"
            ! grep -q 'LEVANTAMENTOS DOCUMENTAIS' "$TEXT"
            ! grep -q 'DADOS CADASTRAIS' "$TEXT"
            ! grep -q 'documento-antigo.pdf' "$TEXT"
            ! grep -q 'BANCO TESTE NÃO EXIBIR' "$TEXT"
          done

          grep -q '4.2. PARECER DO REGULADOR' "$OUT/document.xml"
          grep -q 'EVIDÊNCIAS DA CAUSA' "$OUT/document.xml"
          grep -q 'laudo-causa.pdf' "$OUT/document.xml"
          ! grep -q 'LEVANTAMENTOS DOCUMENTAIS' "$OUT/document.xml"
          ! grep -q 'DADOS CADASTRAIS' "$OUT/document.xml"
          pdfinfo "$BROWSER_PDF" > "$OUT/browser-pdfinfo.txt"
          pdfinfo "$WORD_PDF" > "$OUT/word-pdfinfo.txt"
          cat "$OUT/result.json"
          cat "$OUT/browser-pdfinfo.txt"
          cat "$OUT/word-pdfinfo.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0630-production-validation
          path: /tmp/v0630-validation
          if-no-files-found: warn
