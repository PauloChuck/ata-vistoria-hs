name: Validate V0630 clean V2

on:
  push:
    branches:
      - feature/v0630-parecer-evidencias-reset-v2
    paths:
      - .github/workflows/validate-v0630-clean-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check fast_track/v06/direct-app-0630.js
          node --check fast_track/v06/direct-layout-0630.js
          node --check fast_track/v06/direct-word-0630.js
          test "$(grep -c 'function validationErrors' fast_track/v06/direct-app-0630.js)" -eq 1
          ! grep -q 'numms\[0\]' fast_track/v06/direct-app-0630.js
          ! grep -q 'id="documentInput"' fast_track/v062.html
          ! grep -q 'id="documentList"' fast_track/v062.html
          ! grep -q 'id="noDocuments"' fast_track/v062.html
          ! grep -qi 'LEVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-layout-0630.js
          ! grep -qi 'DADOS CADASTRAIS' fast_track/v06/direct-layout-0630.js
          ! grep -qi 'LEVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-word-0630.js
          ! grep -qi 'DADOS CADASTRAIS' fast_track/v06/direct-word-0630.js

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0630-node /tmp/v0630-clean-v2
          cd /tmp/v0630-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Run corrected browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0630-clean-v2
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/validate-v0630-clean.yml').read_text(encoding='utf-8')
          start=source.index("          cat > \"$OUT/test.js\" <<'NODE'\n") + len("          cat > \"$OUT/test.js\" <<'NODE'\n")
          end=source.index("\n          NODE\n",start)
          script=source[start:end]
          script=script.replace("const out='/tmp/v0630-clean';","const out='/tmp/v0630-clean-v2';")
          script=script.replace("await page.click('[data-action=\"save-draft\"]');","await page.evaluate(()=>document.querySelector('[data-action=\"save-draft\"]').click());")
          script=script.replace("await page.click('[data-action=\"export-backup\"]');","await page.evaluate(()=>document.querySelector('[data-action=\"export-backup\"]').click());")
          Path('/tmp/v0630-clean-v2/test.js').write_text(script,encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          NODE_PATH=/tmp/v0630-node/node_modules node "$OUT/test.js"

      - name: Validate Word and PDF contents
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0630-clean-v2
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          PDF_BROWSER="$OUT/relatorio-browser.pdf"
          test -s "$DOCX"
          test -s "$PDF_BROWSER"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/render" "$OUT/lo-profile"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF_BROWSER" "$OUT/browser.txt"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF_WORD=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$PDF_WORD"
          pdftotext -layout "$PDF_WORD" "$OUT/word.txt"
          pdftoppm -png -r 105 "$PDF_WORD" "$OUT/render/page" >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import json
          out=Path('/tmp/v0630-clean-v2')
          document=(out/'docx/word/document.xml').read_text(encoding='utf-8',errors='ignore')
          browser=(out/'browser.txt').read_text(encoding='utf-8',errors='ignore')
          word=(out/'word.txt').read_text(encoding='utf-8',errors='ignore')
          outputs={'PDF do navegador':browser,'PDF renderizado do Word':word,'OOXML do Word':document}
          forbidden=['LEVANTAMENTOS DOCUMENTAIS','DADOS CADASTRAIS','documento-antigo.pdf','BANCO TESTE NÃO EXIBIR']
          required=['PARECER DO REGULADOR','EVIDÊNCIAS DA CAUSA','Fotografia da causa','laudo-causa.pdf','Laudo técnico principal','DEMONSTRATIVO DE INDENIZAÇÃO','DECLARAÇÃO DE OUTROS SEGUROS','CRONOLOGIA','INFORMAÇÕES COMPLEMENTARES']
          for name,text in outputs.items():
              upper=text.upper()
              for value in forbidden:
                  if value.upper() in upper: raise SystemExit(f'{name}: conteúdo removido encontrado: {value}')
              for value in required:
                  if value.upper() not in upper: raise SystemExit(f'{name}: conteúdo esperado ausente: {value}')
          for name,text in [('PDF do navegador',browser),('PDF renderizado do Word',word)]:
              if text.upper().count('4.2. PARECER DO REGULADOR') != 1: raise SystemExit(f'{name}: parecer duplicado ou ausente')
          media=list((out/'docx/word/media').glob('*'))
          if len(media)<5: raise SystemExit(f'Quantidade insuficiente de mídias no DOCX: {len(media)}')
          result=json.loads((out/'result.json').read_text(encoding='utf-8'))
          if result['reset']['photos']!=0 or result['reset']['damages']!=0 or result['reset']['evidence']!=1: raise SystemExit('Limpeza na recarga divergente')
          (out/'validation-summary.txt').write_text(
              f"Páginas da prévia: {result['preview']['pages']}\n"
              f"Antes da recarga — fotos: {result['beforeReload']['photos']}, danos: {result['beforeReload']['damages']}\n"
              f"Após recarga — fotos: {result['reset']['photos']}, danos: {result['reset']['damages']}, evidências: {result['reset']['evidence']}\n"
              f"Mídias no DOCX: {len(media)}\n",encoding='utf-8')
          print((out/'validation-summary.txt').read_text())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0630-clean-v2-validation
          path: /tmp/v0630-clean-v2
          if-no-files-found: warn
