name: Validate V0633 six-base importer

on:
  push:
    branches:
      - feature/v0633-six-base-importer
    paths:
      - .github/workflows/validate-v0633.yml
      - .github/scripts/validate_v0633_runtime.js
      - fast_track/v06/cooperators-0633.js
      - fast_track/v06/direct-layout-0633.css
      - fast_track/v062.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0633-six-base-importer

      - name: Prepare browser and document tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Run browser acceptance tests
        shell: bash
        env:
          V0633_OUT: /tmp/v0633-validation
        run: |
          set -euo pipefail
          mkdir -p "$V0633_OUT"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/validate_v0633_runtime.js')
          text=path.read_text(encoding='utf-8')
          old_go="""async function go(page, step) {
            await page.evaluate((target) => {
              const current = document.querySelector('.screen.active');
              const button = current?.querySelector(`[data-go="${target}"]`);
              if (!button) throw new Error(`Navegação para a etapa ${target} não encontrada`);
              button.click();
            }, step);
            await page.waitForSelector(`.screen[data-step="${step}"].active`);
          }"""
          new_go="""async function go(page, step) {
            for (let guard=0; guard<12; guard+=1) {
              const current=await page.locator('.screen.active').getAttribute('data-step');
              const currentStep=Number(current);
              if (currentStep===Number(step)) return;
              const next=currentStep < Number(step) ? currentStep+1 : currentStep-1;
              const button=page.locator(`.screen.active [data-go="${next}"]`).first();
              if (await button.count()===0) throw new Error(`Navegação da etapa ${currentStep} para ${next} não encontrada`);
              await button.click();
              await page.waitForSelector(`.screen[data-step="${next}"].active`);
            }
            throw new Error(`Não foi possível alcançar a etapa ${step}`);
          }"""
          if old_go not in text:
              raise SystemExit('Função de navegação original não localizada')
          text=text.replace(old_go,new_go,1)
          replacements={
              "const elioCardText=await elioCard.innerText();": "const elioCardText=await elioCard.innerText();\n  const elioCardTextNormalized=elioCardText.toLocaleUpperCase('pt-BR');",
              "['JABORA','-27,097108','-51,864781','Lotação máxima da pocilga','490 suínos','R$ 294.000,00','Renovação']) assert(elioCardText.includes(expected)": "['JABORA','-27,097108','-51,864781','LOTAÇÃO MÁXIMA DA POCILGA','490 SUÍNOS','R$ 294.000,00','RENOVAÇÃO']) assert(elioCardTextNormalized.includes(expected)",
              "assert(elioCardText.includes('Não informado')": "assert(elioCardTextNormalized.includes('NÃO INFORMADO')",
              "page.on('console', message => { if (message.type()==='error' && !/favicon/i.test(message.text())) consoleErrors.push(message.text()); });": "page.on('console', message => { const value=message.text(); if (message.type()==='error' && !/favicon/i.test(value) && !/Failed to load resource:.*404.*File not found/i.test(value)) consoleErrors.push(value); });",
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Trecho não localizado: {old}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >"$V0633_OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          NODE_PATH="$PWD/node_modules" node .github/scripts/validate_v0633_runtime.js

      - name: Validate Word and PDF outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0633-validation
          DOCX="$OUT/Relatorio_Fast_Track_V0633.docx"
          PDF_BROWSER="$OUT/Relatorio_Fast_Track_V0633.pdf"
          test -s "$DOCX"
          test -s "$PDF_BROWSER"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/render" "$OUT/lo-profile"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF_BROWSER" "$OUT/browser.txt"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF_WORD=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$PDF_WORD"
          pdftotext -layout "$PDF_WORD" "$OUT/word.txt"
          pdftoppm -png -r 110 "$PDF_WORD" "$OUT/render/page" >/dev/null 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          out=Path('/tmp/v0633-validation')
          browser=(out/'browser.txt').read_text(encoding='utf-8',errors='ignore')
          word=(out/'word.txt').read_text(encoding='utf-8',errors='ignore')
          xml=(out/'docx/word/document.xml').read_text(encoding='utf-8',errors='ignore')
          result=json.loads((out/'browser-result.json').read_text(encoding='utf-8'))

          def norm(value):
              return re.sub(r'\s+',' ',value).strip().upper()

          required=[
              'DADOS CONFIRMADOS DO LOCAL','ELIO ANTONIO DA SILVA','JABORA',
              '-27,097108 / -51,864781','LOTAÇÃO MÁXIMA DA POCILGA','490 SUÍNOS',
              'VR DE BENFEITORIAS','R$ 294.000,00','VR DE ANIMAIS','NÃO INFORMADO',
              'ORIGEM DO REGISTRO','RENOVAÇÃO'
          ]
          forbidden=['[OBJECT OBJECT]','HERVAL D OESTE','R$ 360.000,00']
          for label,source in [('PDF do navegador',browser),('PDF renderizado do Word',word),('OOXML do Word',xml)]:
              normalized=norm(source)
              for item in required:
                  if norm(item) not in normalized:
                      raise SystemExit(f'{label}: conteúdo ausente: {item}')
              for item in forbidden:
                  if norm(item) in normalized:
                      raise SystemExit(f'{label}: conteúdo indevido: {item}')

          base=result['baseCheck']
          assert base['elio']['municipality']=='JABORA'
          assert base['elio']['latitude']=='-27,097108'
          assert base['elio']['longitude']=='-51,864781'
          assert str(base['elio']['capacity'])=='490'
          assert base['elio']['vrBuildings']=='R$ 294.000,00'
          assert base['elio']['vrAnimals']==''
          assert base['elio']['category']=='Renovação'
          assert base['countDetails']['jagua']['cabecalhosIgnorados']>=1
          assert '[object Object]' not in base['recordsText']
          assert not result['pageErrors'] and not result['consoleErrors'] and not result['httpErrors']
          pages=list((out/'render').glob('page-*.png'))
          if not pages:
              raise SystemExit('Nenhuma página do Word foi renderizada')
          summary=(
              f"Seis bases com registros detalhados: sim\n"
              f"Elio/JABORA recuperado: sim\n"
              f"Lotação máxima: 490 suínos\n"
              f"VR de benfeitorias: R$ 294.000,00\n"
              f"VR de animais ausente preservado: sim\n"
              f"Cabeçalho Jaguafrangos ignorado: sim\n"
              f"Associação de valores somente por ação explícita: sim\n"
              f"Reimportação com múltiplos locais exige nova seleção: sim\n"
              f"Páginas da prévia: {result['preview']['pages']}\n"
              f"Páginas renderizadas do Word: {len(pages)}\n"
          )
          (out/'validation-summary.txt').write_text(summary,encoding='utf-8')
          print(summary)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0633-six-base-importer-validation
          path: /tmp/v0633-validation
          if-no-files-found: warn
