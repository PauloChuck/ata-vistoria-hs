name: Fix V0632 validation 404

on:
  push:
    branches:
      - feature/v0632-consulta-cooperados
    paths:
      - .github/workflows/fix-v0632-validation-404.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_v0632_validation_404.py
          node --check .github/scripts/validate_v0632.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_v0632_validation_404.py .github/workflows/fix-v0632-validation-404.yml
          git add .github/scripts/validate_v0632.js
          git commit -m 'test(v0632): ignorar somente o 404 genérico do favicon'
          git push origin HEAD:feature/v0632-consulta-cooperados
