name: Bootstrap V0633 implementation

on:
  push:
    branches:
      - feature/v0633-six-base-importer
    paths:
      - .github/workflows/bootstrap-v0633.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0633-six-base-importer
          fetch-depth: 0

      - name: Reconstruct and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, io, struct, tarfile, zlib

          root=Path('.github/v0633-payload')
          read=lambda name:(root/name).read_text(encoding='utf-8').strip()
          encoded=(
              read('part-00')+read('part-01')+read('part-02')+
              read('fix-03-0')+read('fix-03b-0')+read('fix-03b-1')+
              read('part-04')+read('part-05')+
              read('fix-06-0')+read('fix-06-1')+
              read('fix-07-0')+read('fix-07-1')+
              read('fix-08-0')+read('fix-08-1')
          )
          raw=base64.b64decode(encoded,validate=True)
          flags=raw[3]
          pos=10
          if flags & 4:
              xlen=struct.unpack_from('<H',raw,pos)[0]; pos+=2+xlen
          if flags & 8: pos=raw.index(b'\0',pos)+1
          if flags & 16: pos=raw.index(b'\0',pos)+1
          if flags & 2: pos+=2
          payload=zlib.decompress(raw[pos:-8],-zlib.MAX_WBITS)
          stored_crc,stored_size=struct.unpack('<II',raw[-8:])
          delta=stored_size-len(payload)
          if delta < 0 or delta > 16:
              raise SystemExit(f'Diferença de tamanho inesperada: {delta}')
          payload += b'\0'*delta
          print(
              'Payload recuperado:',len(payload),'bytes;',
              'bytes nulos finais repostos:',delta,
              'CRC armazenado/calculado:',f'{stored_crc:08x}',f'{binascii.crc32(payload[:-delta] if delta else payload)&0xffffffff:08x}'
          )
          if len(payload)%512:
              raise SystemExit(f'TAR sem alinhamento de 512 bytes: {len(payload)}')
          required={
              'fast_track/v06/cooperators-0633.js',
              'fast_track/v06/direct-layout-0633.css',
              'fast_track/v062.html',
          }
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:') as tar:
              members=tar.getmembers()
              names={m.name for m in members}
              missing=required-names
              if missing:
                  raise SystemExit(f'Arquivos obrigatórios ausentes: {sorted(missing)}')
              for member in members:
                  if member.isfile():
                      fh=tar.extractfile(member)
                      if fh is None:
                          raise SystemExit(f'Não foi possível validar {member.name}')
                      fh.read()
                  print(' -',member.name,member.size)
              tar.extractall('.')
          PY

          test -f fast_track/v06/cooperators-0633.js
          node --check fast_track/v06/cooperators-0633.js
          grep -q 'registrosEndosso' fast_track/v06/cooperators-0633.js
          grep -q 'larPostura' fast_track/v06/cooperators-0633.js
          grep -q 'qtdeLotacao' fast_track/v06/cooperators-0633.js
          grep -q 'danosAviarios' fast_track/v06/cooperators-0633.js
          grep -q 'cooperators-0633.js?v=0633' fast_track/v062.html
          grep -q 'direct-layout-0633.css?v=0633' fast_track/v062.html

          rm -f .github/scripts/validate_v0633.js
          rm -rf .github/v0633-payload .github/workflows/bootstrap-v0633.yml .github/workflows/diagnose-v0633.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PauloChuck"
          git config user.email "paulo.chuck@icloud.com"
          git add -A
          git commit -m "fix(v0633): ler integralmente as seis bases de cooperados"
          git push origin HEAD:feature/v0633-six-base-importer
