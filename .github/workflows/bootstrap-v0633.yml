name: Bootstrap V0633 implementation

on:
  push:
    branches:
      - feature/v0633-six-base-importer
    paths:
      - .github/workflows/bootstrap-v0633.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0633-six-base-importer
          fetch-depth: 0

      - name: Reconstruct and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import gzip
          import itertools
          import io
          import struct
          import tarfile
          import zlib

          root = Path('.github/v0633-payload')
          read = lambda name: (root / name).read_text(encoding='utf-8').strip()

          fixed03 = read('fix-03-0') + read('fix-03b-0') + read('fix-03b-1')
          fixed03a = read('fix-03-0') + read('fix-03-1')
          fixed06 = read('fix-06-0') + read('fix-06-1')
          fixed07 = read('fix-07-0') + read('fix-07-1')
          fixed08 = read('fix-08-0') + read('fix-08-1')

          options = {
              '03': [('03-final', fixed03), ('03-a', fixed03a)],
              '06': [('06-fixed', fixed06), ('06-original', read('part-06'))],
              '07': [('07-fixed', fixed07)],
              '08': [('08-fixed', fixed08), ('08-original', read('part-08'))],
          }
          prefix = read('part-00') + read('part-01') + read('part-02')
          middle = read('part-04') + read('part-05')

          def gunzip_recover(raw):
              if raw[:2] != b'\x1f\x8b' or raw[2] != 8:
                  raise ValueError('cabeçalho gzip inválido')
              flags = raw[3]
              pos = 10
              if flags & 4:
                  xlen = struct.unpack_from('<H', raw, pos)[0]
                  pos += 2 + xlen
              if flags & 8:
                  pos = raw.index(b'\0', pos) + 1
              if flags & 16:
                  pos = raw.index(b'\0', pos) + 1
              if flags & 2:
                  pos += 2
              payload = zlib.decompress(raw[pos:-8], -zlib.MAX_WBITS)
              stored_crc, stored_size = struct.unpack('<II', raw[-8:])
              actual_crc = binascii.crc32(payload) & 0xffffffff
              delta = stored_size - (len(payload) & 0xffffffff)
              if delta < 0 or delta > 1024:
                  raise ValueError(f'tamanho gzip irrecuperável: {len(payload)} / esperado {stored_size}')
              if delta:
                  # O payload é um TAR e os bytes ausentes estão no bloco nulo final.
                  # Completar somente a pequena diferença declarada no trailer gzip.
                  payload += b'\0' * delta
              return payload, stored_crc, actual_crc, delta

          chosen = None
          chosen_payload = None
          failures = []
          for choice03, choice06, choice07, choice08 in itertools.product(
              options['03'], options['06'], options['07'], options['08']
          ):
              labels = [choice03[0], choice06[0], choice07[0], choice08[0]]
              encoded = prefix + choice03[1] + middle + choice06[1] + choice07[1] + choice08[1]
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  try:
                      payload = gzip.decompress(raw)
                      note = 'CRC e tamanho válidos'
                  except Exception:
                      payload, stored_crc, actual_crc, padded = gunzip_recover(raw)
                      note = (
                          f'contêiner recuperado: CRC armazenado={stored_crc:08x}, '
                          f'CRC calculado={actual_crc:08x}, bytes nulos finais repostos={padded}'
                      )
                  if len(payload) % 512:
                      raise ValueError(f'TAR sem alinhamento de 512 bytes: {len(payload)}')
                  with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as tar:
                      members = tar.getmembers()
                      names = [member.name for member in members]
                      required = [
                          'fast_track/v06/cooperators-0632.js',
                          'fast_track/v062.html',
                      ]
                      if not all(name in names for name in required):
                          raise ValueError(f'arquivos obrigatórios ausentes: {required}')
                      for member in members:
                          if member.isfile():
                              extracted = tar.extractfile(member)
                              if extracted is None:
                                  raise ValueError(f'não foi possível ler {member.name}')
                              extracted.read()
                  chosen = (labels, note)
                  chosen_payload = payload
                  break
              except Exception as exc:
                  failures.append(f'{labels}: {exc}')

          if chosen_payload is None:
              print('\n'.join(failures))
              raise SystemExit('Nenhuma combinação produziu um TAR íntegro')

          print('Combinação selecionada:', ', '.join(chosen[0]))
          print(chosen[1])
          Path('/tmp/v0633-payload.tar').write_bytes(chosen_payload)
          with tarfile.open(fileobj=io.BytesIO(chosen_payload), mode='r:') as tar:
              print('Arquivos do payload:')
              for member in tar.getmembers():
                  print(' -', member.name, member.size)
              tar.extractall('.')
          PY

          test -f fast_track/v06/cooperators-0632.js
          node --check fast_track/v06/cooperators-0632.js
          if test -f fast_track/v06/direct-app.js; then node --check fast_track/v06/direct-app.js; fi
          if test -f fast_track/v06/direct-report.js; then node --check fast_track/v06/direct-report.js; fi
          if test -f fast_track/v06/direct-word.js; then node --check fast_track/v06/direct-word.js; fi
          grep -q 'registrosEndosso' fast_track/v06/cooperators-0632.js
          grep -q 'larPostura' fast_track/v06/cooperators-0632.js
          grep -q 'qtdeLotacao' fast_track/v06/cooperators-0632.js
          grep -q 'danosAviarios' fast_track/v06/cooperators-0632.js

          rm -rf .github/v0633-payload .github/workflows/bootstrap-v0633.yml .github/workflows/diagnose-v0633.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PauloChuck"
          git config user.email "paulo.chuck@icloud.com"
          git add -A
          git commit -m "fix(v0633): ler integralmente as seis bases de cooperados"
          git push origin HEAD:feature/v0633-six-base-importer
