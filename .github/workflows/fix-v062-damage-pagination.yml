name: Fix V062 damage pagination

on:
  push:
    branches:
      - fix/v062-damage-table-pagination
    paths:
      - .github/workflows/fix-v062-damage-pagination.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch damage relation pagination only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          report_path = Path('fast_track/v06/direct-report.js')
          report = report_path.read_text(encoding='utf-8')

          replacement = r'''  function technicalStartContent(state) {
            const f = state.fields || {};
            const map = state.map || {};
            return `
              <div class="doc-section">1. LOCAL DO SINISTRO</div>
              <p class="doc-text">Trata-se de propriedade rural destinada a engorda de animais (matérias-primas) do segurado.</p>
              <div class="map-report">${map.dataUrl ? `<img src="${attr(map.dataUrl)}" style="object-fit:${map.fit || 'contain'};object-position:${Number(map.posX ?? 50)}% ${Number(map.posY ?? 50)}%">` : '<span>Imagem de localização não informada.</span>'}</div>
              <p class="doc-caption">Localização da propriedade sinistrada.</p>

              <div class="doc-section">2. DESCRIÇÃO DA OCORRÊNCIA</div>
              <p class="doc-text">${esc(occurrenceText(f.lossDate))}</p>

              <div class="doc-section">3. COBERTURA RECLAMADA</div>
              <table class="doc-table coverage-table"><thead><tr><th class="left">Cobertura</th><th>Limite de Indenização</th><th>Franquia</th></tr></thead>
              <tbody><tr><td class="left">${esc(f.coverageName || 'Vendaval / Granizo')}</td><td>${money(35000000)}</td><td>15% com mínimo<br>de ${money(3000)}</td></tr></tbody></table>`;
          }

          function estimateDamageRowHeight(item) {
            const ageText = `${item?.age || ''} ${item?.ageUnit || ''}`.trim();
            const cells = [
              [String(item?.description || ''), 31],
              [String(item?.quantity || ''), 8],
              [String(item?.unit || ''), 7],
              [ageText, 11],
              [money(item?.claimedTotal), 14]
            ];
            const lines = Math.max(1, ...cells.map(([value, chars]) => Math.ceil(Math.max(1, value.length) / chars)));
            return 3 + (lines * 4.6);
          }

          function paginateDamageItems(items) {
            const source = Array.isArray(items) ? items : [];
            if (!source.length) return [{items:[], start:0}];
            const pages = [];
            let start = 0;
            while (start < source.length) {
              const available = pages.length ? 184 : 146;
              let used = 0;
              let end = start;
              while (end < source.length) {
                const height = estimateDamageRowHeight(source[end]);
                if (end > start && used + height > available) break;
                used += height;
                end += 1;
                if (used >= available) break;
              }
              pages.push({items:source.slice(start,end), start});
              start = end;
            }
            return pages;
          }

          function damageStartContent(state, items, start = 0) {
            const f = state.fields || {};
            const table = items.length ? `<table class="doc-table damage-table"><thead><tr><th>Item</th><th class="left">Material danificado</th><th>Quantidade</th><th>Unidade</th><th>Idade</th><th>Valor reclamado</th></tr></thead><tbody>${damageRows(items,start)}</tbody></table>` : '<p class="doc-text">Nenhum item cadastrado.</p>';
            return `
              <div class="doc-section">4. APURAÇÕES DA REGULAÇÃO</div>
              <div class="doc-subsection">4.1. LEVANTAMENTOS EM VISTORIA</div>
              <p class="doc-text">${esc(inspectionText(f.inspectionDate))}</p>
              <div class="doc-subsection"><u>RELAÇÃO DE DANOS:</u></div>
              ${table}`;
          }

          function damageContinuationContent(items, start)'''

          pattern = re.compile(r"  function technicalStartContent\(state, firstDamages\) \{.*?\n  function damageContinuationContent\(items, start\)", re.S)
          report, count = pattern.subn(replacement, report, count=1)
          if count != 1:
            raise SystemExit(f'Falha ao substituir bloco técnico/relacao de danos: {count}')

          old_build = '''    contents.push({html:coverContent(state), first:true});
              const firstDamageCount = Math.min(3, damages.length);
              contents.push({html:technicalStartContent(state, damages.slice(0, firstDamageCount))});

              for (let start = firstDamageCount; start < damages.length; start += 9) {
                contents.push({html:damageContinuationContent(damages.slice(start,start+9),start)});
              }
          '''
          new_build = '''    contents.push({html:coverContent(state), first:true});
              contents.push({html:technicalStartContent(state)});

              const damagePages = paginateDamageItems(damages);
              damagePages.forEach((page,index) => {
                contents.push({html:index === 0
                  ? damageStartContent(state,page.items,page.start)
                  : damageContinuationContent(page.items,page.start)});
              });
          '''
          if old_build not in report:
            raise SystemExit('Bloco buildContents esperado não encontrado')
          report = report.replace(old_build, new_build, 1)
          report = report.replace('calculate, buildContents, buildHTML', 'calculate, paginateDamageItems, buildContents, buildHTML', 1)
          report_path.write_text(report, encoding='utf-8')

          word_path = Path('fast_track/v06/direct-word.js')
          word = word_path.read_text(encoding='utf-8')
          word_replacement = r'''    const damageItems=state.damages||[];
              if(damageItems.length){
                const damageHeader=new TableRow({tableHeader:true,cantSplit:true,children:[tcell('Item',{width:7,bold:true}),tcell('Material danificado',{width:36,bold:true,align:AlignmentType.LEFT}),tcell('Quantidade',{width:12,bold:true}),tcell('Unidade',{width:10,bold:true}),tcell('Idade',{width:15,bold:true}),tcell('Valor reclamado',{width:20,bold:true})]});
                const damageDataRows=damageItems.map((item,index)=>new TableRow({cantSplit:true,children:[tcell(String(index+1),{width:7}),tcell(item.description,{width:36,align:AlignmentType.LEFT}),tcell(item.quantity,{width:12}),tcell(item.unit,{width:10}),tcell(`${item.age || ''} ${item.ageUnit || ''}`,{width:15}),tcell(REPORT().money(item.claimedTotal),{width:20})]}));
                technical.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[damageHeader,...damageDataRows]}));
              } else {
                technical.push(para('Nenhum item cadastrado.',{alignment:AlignmentType.LEFT}));
              }
              addPage(technical);

              // Fotografias — quatro por página'''
          word_pattern = re.compile(r"    const firstDamages=\(state\.damages\|\|\[\]\)\.slice\(0,3\);.*?    // Fotografias — quatro por página", re.S)
          word, count = word_pattern.subn(word_replacement, word, count=1)
          if count != 1:
            raise SystemExit(f'Falha ao substituir paginação manual no Word: {count}')
          word_path.write_text(word, encoding='utf-8')

          css_path = Path('fast_track/v06/direct.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '.damage-table{font-size:9pt}\n'
          addition = '.damage-table{font-size:9pt}\n.damage-table th,.damage-table td{padding:1.25mm 1mm}\n.damage-table tr{break-inside:avoid;page-break-inside:avoid}\n'
          if marker not in css:
            raise SystemExit('Marcador CSS da tabela de danos não encontrado')
          css = css.replace(marker, addition, 1)
          css_path.write_text(css, encoding='utf-8')

          for html_name in ['fast_track/v062.html','fast_track/v06.html']:
            path = Path(html_name)
            text = path.read_text(encoding='utf-8')
            if '0622' not in text:
              raise SystemExit(f'Cache-buster 0622 não encontrado em {html_name}')
            path.write_text(text.replace('0622','0623'), encoding='utf-8')
          PY

          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          node --check fast_track/v06/direct-app.js
          grep -q 'paginateDamageItems' fast_track/v06/direct-report.js
          grep -q 'tableHeader:true,cantSplit:true' fast_track/v06/direct-word.js
          ! grep -q 'slice(0,3)' fast_track/v06/direct-word.js
          ! grep -q 'LEVANTAMENTOS EM VISTORIA — CONTINUAÇÃO' fast_track/v06/direct-word.js

      - name: Prepare browser and document tests
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Test four-item case and stress pagination
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v062-pagination-test
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v062-pagination-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          cat > /tmp/v062-pagination-test/test.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#e8eef1"/><rect x="80" y="80" width="1040" height="540" fill="#b8d6b1"/><path d="M100 560 L1100 140" stroke="#777" stroke-width="36"/><circle cx="780" cy="310" r="34" fill="#c33"/><text x="110" y="150" font-family="Arial" font-size="52">Mapa de teste para paginação</text></svg>`;
          const mapDataUrl = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
          const baseFields = {
            insurerClaim:'1325000',hsClaim:'S2609000',insurer:'SOMPO SEGUROS S/A',insured:'COOPERATIVA CENTRAL AURORA ALIMENTOS',
            claimantName:'Cooperado Teste Paginação',claimantCpf:'000.000.000-00',riskAddress:'Linha Teste, Município/SC',policyNumber:'9600131927',
            productName:'RISCOS NOMEADOS',broker:'ALPER CONSULTORIA E CORRETORA DE SEGUROS S/A',lossDate:'2026-11-04',coverageName:'Vendaval / Granizo',
            inspectionDate:'2026-11-10',regulatorOpinion:'Diante do exposto, o sinistro está amparado pela cobertura de Vendaval/Granizo da apólice.',
            otherInsurance:'nao',otherInsuranceDetails:'',bankName:'CRESOL',bankAgency:'2508',bankAccount:'1.801-5',noticeDate:'2026-11-05',scheduleDate:'2026-11-06',
            reportCity:'Blumenau (SC)',reportDate:'2026-11-10',regulatorName:'Paulo R. Schlosser',regulatorCpf:'068.613.739-66',noDocuments:true,
            mapFit:'contain',mapPosX:'50',mapPosY:'50'
          };
          const makeDamage = (i) => ({
            id:`damage_${i}`,description:i % 4 === 0 ? `Item de dano ${String(i).padStart(2,'0')} - descrição técnica mais extensa para validar a quebra controlada dentro da célula` : `Item de dano ${String(i).padStart(2,'0')} - material apurado em vistoria`,
            quantity:String(i * 10),unit:i % 3 === 0 ? 'conjunto' : 'un.',age:String((i % 8) + 1),ageUnit:i % 5 === 0 ? 'meses' : 'anos',claimedTotal:String(1000 + i * 137),assessedTotal:String(1000 + i * 137)
          });
          const stateFor = (count) => ({
            version:'0.6.2',fields:{...baseFields},map:{dataUrl:mapDataUrl,name:'mapa-teste.svg',fit:'contain',posX:'50',posY:'50'},
            damages:Array.from({length:count},(_,i)=>makeDamage(i+1)),photos:[],documents:[],signatures:{regulator:null,claimant:null},finalizedAt:null
          });

          async function importState(page,state,name){
            await page.setInputFiles('#backupInput',{name,mimeType:'application/json',buffer:Buffer.from(JSON.stringify(state))});
            await page.waitForFunction((expected)=>document.querySelectorAll('#damageList .damage-card').length===expected,count=state.damages.length,{timeout:20000});
            await page.evaluate(()=>document.querySelector('.screen[data-step="6"] [data-go="7"]').click());
            await page.waitForSelector('.screen[data-step="7"].active');
            await page.waitForSelector('#reportPreview .report-page');
          }

          async function inspectDamagePages(page,expected){
            return await page.evaluate((expected)=>{
              const pages=[...document.querySelectorAll('#reportPreview .report-page')];
              const details=pages.map((page,index)=>{
                const content=page.querySelector('.report-content');
                const footer=page.querySelector('.report-footer');
                const table=page.querySelector('.damage-table');
                const rows=table ? table.querySelectorAll('tbody tr').length : 0;
                const title=page.querySelector('.doc-section')?.textContent?.trim() || '';
                const contentRect=content.getBoundingClientRect();
                const footerRect=footer.getBoundingClientRect();
                const tableRect=table?.getBoundingClientRect();
                return {index:index+1,title,rows,overflow:content.scrollHeight-content.clientHeight,tableBottom:tableRect?.bottom || null,footerTop:footerRect.top,contentBottom:contentRect.bottom};
              }).filter(x=>x.rows||/APURAÇÕES DA REGULAÇÃO/.test(x.title)||/CONTINUAÇÃO/.test(x.title));
              const total=details.reduce((sum,x)=>sum+x.rows,0);
              if(total!==expected) throw new Error(`Relação de danos incompleta: ${total}/${expected}`);
              if(details[0]?.rows<=3) throw new Error(`A primeira página de danos ainda está limitada a ${details[0]?.rows} linhas`);
              for(const item of details){
                if(item.overflow>2) throw new Error(`Conteúdo excedeu a área útil na página ${item.index}: ${item.overflow}px`);
                if(item.tableBottom && item.tableBottom>item.footerTop-2) throw new Error(`Tabela invadiu o rodapé na página ${item.index}`);
              }
              return details;
            },expected);
          }

          (async()=>{
            const out='/tmp/v062-pagination-test';
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const pageErrors=[]; const httpErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400&&!/favicon\.ico/i.test(r.url()))httpErrors.push({status:r.status(),url:r.url()});});
            page.on('dialog',async d=>d.accept());
            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=pagination-ci',{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell');

            await importState(page,stateFor(4),'quatro-itens.json');
            const fourDetails=await inspectDamagePages(page,4);
            if(fourDetails.length!==1) throw new Error(`Quatro itens geraram ${fourDetails.length} páginas de relação de danos`);
            const fourPageIndex=fourDetails[0].index-1;
            await page.locator('#reportPreview .report-page').nth(fourPageIndex).screenshot({path:path.join(out,'quatro-itens-relacao.png')});

            await importState(page,stateFor(24),'vinte-quatro-itens.json');
            const stressDetails=await inspectDamagePages(page,24);
            if(stressDetails.length<2) throw new Error('Teste de estresse não gerou continuação da relação de danos');
            await page.locator('#reportPreview').screenshot({path:path.join(out,'preview-estresse.png')});

            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            await page.emulateMedia({media:'print'});
            await page.pdf({path:path.join(out,'Relatorio_Fast_Track_paginacao_browser.pdf'),format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const downloadPromise=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await downloadPromise;
            const wordPath=path.join(out,download.suggestedFilename());
            await download.saveAs(wordPath);
            if(!fs.existsSync(wordPath)||fs.statSync(wordPath).size<15000)throw new Error(`DOCX inválido: ${wordPath}`);

            fs.writeFileSync(path.join(out,'browser-result.json'),JSON.stringify({fourDetails,stressDetails,pageErrors,httpErrors,wordPath},null,2));
            if(pageErrors.length||httpErrors.length)throw new Error(JSON.stringify({pageErrors,httpErrors}));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

          NODE_PATH="$PWD/node_modules" node /tmp/v062-pagination-test/test.js

      - name: Validate Word package and rendered pagination
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-pagination-test
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          unzip -p "$DOCX" word/document.xml > "$OUT/document.xml"
          grep -q 'Item de dano 24' "$OUT/document.xml"
          grep -q 'w:tblHeader' "$OUT/document.xml"
          grep -q 'w:cantSplit' "$OUT/document.xml"
          ! grep -q 'LEVANTAMENTOS EM VISTORIA — CONTINUAÇÃO' "$OUT/document.xml"

          OFFICE=$(command -v libreoffice || command -v soffice)
          mkdir -p "$OUT/lo-profile" "$OUT/docx-render"
          "$OFFICE" -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/docx-render" "$DOCX"
          PDF=$(find "$OUT/docx-render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$PDF"
          pdfinfo "$PDF" > "$OUT/docx-render/pdfinfo.txt"
          pdftotext -layout "$PDF" "$OUT/docx-render/document.txt"
          pdftotext -bbox-layout "$PDF" "$OUT/docx-render/document-bbox.html"
          mkdir -p "$OUT/docx-render/pages"
          pdftoppm -png -r 115 "$PDF" "$OUT/docx-render/pages/page" >/dev/null 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          out=Path('/tmp/v062-pagination-test/docx-render')
          text=(out/'document.txt').read_text(encoding='utf-8',errors='ignore')
          pages=text.split('\f')
          labels=[f'Item de dano {i:02d}' for i in range(1,25)]
          counts=[sum(label in page for label in labels) for page in pages]
          if sum(counts)!=24:
            raise SystemExit(f'Itens no PDF do Word: {sum(counts)}/24; distribuição={counts}')
          if max(counts)<=3:
            raise SystemExit(f'A tabela do Word continua limitada a três itens por página: {counts}')

          bbox=ET.parse(out/'document-bbox.html').getroot()
          ns={'x':'http://www.w3.org/1999/xhtml'}
          checked=0
          for page in bbox.findall('.//x:page',ns):
            words=page.findall('.//x:word',ns)
            footer_words=[w for w in words if (w.text or '')=='Matriz']
            if not footer_words:
              continue
            footer_y=min(float(w.attrib['yMin']) for w in footer_words)
            body=[]
            for w in words:
              value=(w.text or '').strip()
              if not value or value in {'Matriz','www.horizonservitas.com'}:
                continue
              y=float(w.attrib['yMax'])
              if y < footer_y-2:
                body.append(y)
            if body and max(body)>=footer_y-1:
              raise SystemExit('Conteúdo do Word alcançou o rodapé')
            checked+=1
          if checked==0:
            raise SystemExit('Não foi possível validar as coordenadas do rodapé')
          (out/'pagination-summary.txt').write_text(f'Distribuição de itens por página: {counts}\nPáginas verificadas contra o rodapé: {checked}\n',encoding='utf-8')
          PY

          cat "$OUT/browser-result.json"
          cat "$OUT/docx-render/pagination-summary.txt"
          cat "$OUT/docx-render/pdfinfo.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v062-damage-pagination-validation
          path: /tmp/v062-pagination-test
          if-no-files-found: warn

      - name: Commit validated adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-report.js fast_track/v06/direct-word.js fast_track/v06/direct.css fast_track/v062.html fast_track/v06.html
          git commit -m 'fix(v06): preencher páginas da relação de danos'
          git push origin HEAD:fix/v062-damage-table-pagination
