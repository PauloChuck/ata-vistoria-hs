name: Apply V0631 documentais e parecer

on:
  push:
    branches:
      - feature/v0631-documentais-parecer
    paths:
      - .github/workflows/apply-v0631-documentais-parecer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create revision 0631
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v0631.py
          node --check fast_track/v06/direct-app-0631.js
          node --check fast_track/v06/direct-layout-0631.js
          node --check fast_track/v06/direct-word-0631.js
          test "$(grep -c 'id=\"documentaryNarrative\"' fast_track/v062.html)" -eq 1
          test "$(grep -c 'id=\"regulatorOpinion\"' fast_track/v062.html)" -eq 1
          grep -q '4.2. Lavantamentos documentais' fast_track/v062.html
          grep -q '5. Parecer do regulador' fast_track/v062.html
          grep -q '4.2. LAVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-layout-0631.js
          grep -q '5. PARECER DO REGULADOR' fast_track/v06/direct-layout-0631.js
          grep -q "heading('6. DEMONSTRATIVO DE INDENIZAÇÃO')" fast_track/v06/direct-word-0631.js
          ! grep -q '4.2. PARECER DO REGULADOR' fast_track/v06/direct-layout-0631.js
          ! grep -q "subheading('4.2. PARECER DO REGULADOR')" fast_track/v06/direct-word-0631.js
          grep -q 'direct-app-0631.js?v=0631' fast_track/v062.html

      - name: Commit revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v062.html fast_track/v06.html fast_track/v06/direct-app-0631.js fast_track/v06/direct-layout-0631.css fast_track/v06/direct-layout-0631.js fast_track/v06/direct-word-0631.js
          git commit -m 'feat(v0631): reorganizar levantamentos documentais e parecer'
          git push origin HEAD:feature/v0631-documentais-parecer
