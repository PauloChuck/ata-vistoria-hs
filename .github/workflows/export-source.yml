name: Export source snapshot

on:
  push:
    branches:
      - tmp/export-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ata-vistoria-hs-source
          path: .
          include-hidden-files: true
          retention-days: 1
