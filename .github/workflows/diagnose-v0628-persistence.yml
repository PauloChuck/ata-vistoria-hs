name: Diagnose V0628 persistence

on:
  push:
    branches:
      - feature/v062-editable-narratives-doc-intro
    paths:
      - .github/workflows/diagnose-v0628-persistence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/v0628-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          cat > /tmp/diag.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=diag',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('#inspectionNarrative')?.value.length>0);
            const go=async step=>{await page.evaluate(s=>document.querySelector(`[data-go="${s}"]`).click(),step);await page.waitForSelector(`.screen[data-step="${step}"].active`)};
            await page.fill('#lossDate','2027-02-03');
            await go(2);
            const occ='No dia 03 de fevereiro de 2027, TEXTO FINAL OCORRENCIA.\nSEGUNDO PARAGRAFO.';
            await page.fill('#occurrenceNarrative',occ);
            await go(3);
            const ins='Em vistoria presencial realizada no dia 15 de dezembro de 2026, TEXTO FINAL VISTORIA.\nSEGUNDO PARAGRAFO.';
            await page.fill('#inspectionNarrative',ins);
            await page.waitForTimeout(2500);
            async function dbState(){return await page.evaluate(async()=>await new Promise((resolve,reject)=>{const r=indexedDB.open('HSFastTrackV06Direct',1);r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result;const tx=db.transaction('state','readonly');const q=tx.objectStore('state').get('current');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);};}));}
            const before={domOcc:await page.inputValue('#occurrenceNarrative'),domIns:await page.inputValue('#inspectionNarrative'),db:await dbState(),errors:[...errors]};
            console.log('BEFORE',JSON.stringify({domOcc:before.domOcc,domIns:before.domIns,dbOcc:before.db?.fields?.occurrenceNarrative,dbIns:before.db?.fields?.inspectionNarrative,modeOcc:before.db?.fields?.occurrenceNarrativeMode,modeIns:before.db?.fields?.inspectionNarrativeMode,errors},null,2));
            await page.reload({waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('#inspectionNarrative')?.value.length>0);
            await page.waitForTimeout(1000);
            const after={domOcc:await page.inputValue('#occurrenceNarrative'),domIns:await page.inputValue('#inspectionNarrative'),db:await dbState(),errors:[...errors]};
            console.log('AFTER',JSON.stringify({domOcc:after.domOcc,domIns:after.domIns,dbOcc:after.db?.fields?.occurrenceNarrative,dbIns:after.db?.fields?.inspectionNarrative,modeOcc:after.db?.fields?.occurrenceNarrativeMode,modeIns:after.db?.fields?.inspectionNarrativeMode,errors},null,2));
            if(after.domOcc!==occ||after.domIns!==ins) throw new Error('Persistência divergente');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node /tmp/diag.js
