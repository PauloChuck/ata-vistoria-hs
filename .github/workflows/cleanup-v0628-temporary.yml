name: Cleanup V0628 temporary validation files

on:
  push:
    branches:
      - feature/v062-editable-narratives-doc-intro
    paths:
      - .github/workflows/cleanup-v0628-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary scripts and workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/patch_v0628.py \
            .github/scripts/test_v0628.js \
            .github/scripts/test_v0628_acceptance.js \
            .github/scripts/test_v0628_v7.js \
            .github/scripts/validate_v0628.py \
            .github/workflows/apply-v0628-production.yml \
            .github/workflows/diagnose-v0628-modes.yml \
            .github/workflows/diagnose-v0628-persistence.yml \
            .github/workflows/implement-v0628-editable-narratives.yml \
            .github/workflows/implement-v0628-editable-narratives-v2.yml \
            .github/workflows/implement-v0628-editable-narratives-v3.yml \
            .github/workflows/implement-v0628-editable-narratives-v4.yml \
            .github/workflows/implement-v0628-editable-narratives-v5.yml \
            .github/workflows/implement-v0628-editable-narratives-v6.yml \
            .github/workflows/implement-v0628-editable-narratives-v7.yml \
            .github/workflows/validate-v0628-acceptance.yml \
            .github/workflows/validate-v0628-acceptance-v2.yml \
            .github/workflows/validate-v0628-acceptance-v3.yml \
            .github/workflows/validate-v0628-acceptance-v4.yml \
            .github/workflows/cleanup-v0628-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github
          git commit -m 'chore(v06): remover validações temporárias da revisão 0628'
          git push origin HEAD:feature/v062-editable-narratives-doc-intro
