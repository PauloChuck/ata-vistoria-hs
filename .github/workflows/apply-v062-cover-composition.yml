name: Apply V062 cover composition

on:
  push:
    branches:
      - fix/v062-cover-composition
    paths:
      - .github/workflows/apply-v062-cover-composition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cover generation only
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/pattern.subn(replacement, text, count=1)/pattern.subn(lambda _match: replacement, text, count=1)/g' .github/scripts/patch_v062_cover.py
          python3 .github/scripts/patch_v062_cover.py
          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          git diff --check

      - name: Prepare validation tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Validate preview PDF and Word
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-cover-composition
          mkdir -p "$OUT"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          OUT="$OUT" NODE_PATH="$PWD/node_modules" node .github/scripts/test_v062_cover.js

          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          test -n "$DOCX"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 .github/scripts/validate_v062_cover.py xml

          mkdir -p "$OUT/render" "$OUT/lo-profile"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF=$(find "$OUT/render" -name '*.pdf' -print -quit)
          test -s "$PDF"
          pdfinfo "$PDF" > "$OUT/render/pdfinfo.txt"
          pdftotext -bbox-layout "$PDF" "$OUT/render/bbox.html"
          pdftotext -layout "$PDF" "$OUT/render/text.txt"
          pdftoppm -png -r 120 "$PDF" "$OUT/render/page" >/dev/null 2>&1
          python3 .github/scripts/validate_v062_cover.py render

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v062-cover-composition-validation
          path: /tmp/v062-cover-composition
          if-no-files-found: warn

      - name: Commit validated cover correction
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v062-cover-composition.yml
          rm -f .github/scripts/patch_v062_cover.py .github/scripts/test_v062_cover.js .github/scripts/validate_v062_cover.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-report.js fast_track/v06/direct-word.js fast_track/v06/direct.css fast_track/v062.html fast_track/v06.html .github/workflows/apply-v062-cover-composition.yml .github/scripts
          git commit -m 'fix(v06): corrigir composição isolada da capa'
          git push origin HEAD:fix/v062-cover-composition
