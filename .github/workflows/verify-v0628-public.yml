name: Verify V0628 public deployment

on:
  push:
    branches:
      - verification/v0628-public
    paths:
      - .github/workflows/verify-v0628-public.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Test public page, persistence and exports
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0628-public
          mkdir -p "$OUT"
          cat > "$OUT/test.js" <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const path=require('path');

          (async()=>{
            const out='/tmp/v0628-public';
            const url=`https://paulochuck.github.io/ata-vistoria-hs/fast_track/v062.html?v=0628-public-${Date.now()}`;
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const page=await context.newPage();
            const errors=[]; const httpErrors=[]; const resources=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{
              if(r.status()>=400&&!/favicon\.ico/i.test(r.url())) httpErrors.push({status:r.status(),url:r.url()});
              if(/fast_track\/v06\/(direct|brand)/.test(r.url())) resources.push(r.url());
            });
            page.on('dialog',d=>d.accept());
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.app-shell',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#inspectionNarrative')?.value.length>0,{timeout:30000});

            const init=await page.evaluate(()=>({
              report:Boolean(window.FastTrackV06Report),word:Boolean(window.FastTrackV06Word),docx:Boolean(window.docx),
              validDate:typeof window.FastTrackV06Report?.isValidIsoDate==='function',
              occurrence:document.querySelector('#occurrenceNarrative')?.value,
              inspection:document.querySelector('#inspectionNarrative')?.value,
              versionText:document.querySelector('.version')?.textContent
            }));
            if(!init.report||!init.word||!init.docx||!init.validDate) throw new Error(`Inicialização pública incompleta: ${JSON.stringify(init)}`);
            if(!resources.some(u=>u.includes('direct-app.js?v=0628'))||!resources.some(u=>u.includes('direct-report.js?v=0628'))||!resources.some(u=>u.includes('direct-word.js?v=0628'))) throw new Error(`Recursos 0628 não confirmados: ${JSON.stringify(resources)}`);

            await page.click('[data-action="load-example"]');
            const go=async step=>{await page.evaluate(s=>document.querySelector(`[data-go="${s}"]`).click(),step);await page.waitForSelector(`.screen[data-step="${step}"].active`);};
            await go(2);
            await page.fill('#occurrenceLossDate','2027-02-03');
            const occurrence='No dia 03 de fevereiro de 2027, narrativa pública personalizada para validar a revisão 0628.\nSegundo parágrafo público preservado.';
            await page.fill('#occurrenceNarrative',occurrence);
            if(await page.inputValue('#lossDate')!=='2027-02-03') throw new Error('Data pública não foi compartilhada entre as etapas.');
            if(!(await page.locator('#lossDateWarning').evaluate(el=>el.classList.contains('hidden')))) throw new Error('A versão pública ainda restringe novembro de 2026.');

            await go(3);
            await page.fill('#inspectionDate','2027-02-04');
            const inspection='Em vistoria presencial realizada no dia 04 de fevereiro de 2027, foi executada a conferência pública dos danos.\nSegundo parágrafo público da vistoria.';
            await page.fill('#inspectionNarrative',inspection);
            await page.waitForTimeout(1800);

            await page.reload({waitUntil:'networkidle'});
            await page.waitForFunction((expected)=>document.querySelector('#occurrenceNarrative')?.value===expected,occurrence,{timeout:30000});
            if(await page.inputValue('#inspectionNarrative')!==inspection) throw new Error('Texto público da vistoria não persistiu após recarga.');

            await go(4);
            await page.setInputFiles('#documentInput',{name:'laudo-publico.txt',mimeType:'text/plain',buffer:Buffer.from('documento público de teste')});
            await page.waitForSelector('#documentList .document-card');
            await page.fill('#documentList [data-document="type"]','Laudo público');
            await page.fill('#documentList [data-document="description"]','Documento coletado na validação pública');
            if(await page.locator('#documentCollectionIntro').evaluate(el=>el.classList.contains('hidden'))) throw new Error('Introdução documental pública ausente na tela.');

            await go(7);
            await page.waitForSelector('#reportPreview .report-page');
            const preview=await page.evaluate(()=>{
              const text=document.querySelector('#reportPreview').innerText;
              return {text,introCount:(text.match(/Em vistoria foram coletados os documentos abaixo relacionados/g)||[]).length,pages:document.querySelectorAll('#reportPreview .report-page').length};
            });
            for(const required of ['narrativa pública personalizada','Segundo parágrafo público preservado','conferência pública dos danos','Segundo parágrafo público da vistoria','Laudo público','Documento coletado na validação pública']) if(!preview.text.includes(required)) throw new Error(`Prévia pública sem: ${required}`);
            if(preview.introCount!==1) throw new Error(`Introdução pública repetida/ausente: ${preview.introCount}`);

            await page.evaluate(()=>{window.print=()=>{};});
            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .report-page',{state:'attached'});
            await page.emulateMedia({media:'print'});
            const pdfPath=path.join(out,'Relatorio_Fast_Track_v0628_public.pdf');
            await page.pdf({path:pdfPath,format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});

            const wordPromise=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const word=await wordPromise;
            const wordPath=path.join(out,'Relatorio_Fast_Track_v0628_public.docx');
            await word.saveAs(wordPath);
            if(!fs.existsSync(wordPath)||fs.statSync(wordPath).size<15000) throw new Error('DOCX público inválido.');

            const backupPromise=page.waitForEvent('download',{timeout:120000});
            await page.evaluate(()=>document.querySelector('[data-action="export-backup"]').click());
            const backup=await backupPromise;
            const backupPath=path.join(out,'Backup_Fast_Track_v0628_public.json');
            await backup.saveAs(backupPath);
            const backupData=JSON.parse(fs.readFileSync(backupPath,'utf8'));
            if(backupData.fields.occurrenceNarrative!==occurrence||backupData.fields.inspectionNarrative!==inspection) throw new Error('Backup público não preservou as narrativas.');

            await page.locator('#reportPreview .report-page').filter({hasText:'DESCRIÇÃO DA OCORRÊNCIA'}).first().screenshot({path:path.join(out,'public-narrativas.png')});
            await page.locator('#reportPreview .report-page').filter({hasText:'LEVANTAMENTOS DOCUMENTAIS'}).first().screenshot({path:path.join(out,'public-documentos.png')});
            if(errors.length||httpErrors.length) throw new Error(JSON.stringify({errors,httpErrors}));
            fs.writeFileSync(path.join(out,'public-result.json'),JSON.stringify({url,init,resources,preview:{introCount:preview.introCount,pages:preview.pages},wordPath,pdfPath,backupPath},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

          DOCX="$OUT/Relatorio_Fast_Track_v0628_public.docx"
          PDF="$OUT/Relatorio_Fast_Track_v0628_public.pdf"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF" "$OUT/pdf.txt"
          pdfinfo "$PDF" > "$OUT/pdfinfo.txt"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          out=Path('/tmp/v0628-public')
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          root=ET.parse(out/'docx/word/document.xml').getroot()
          paras=[''.join((t.text or '') for t in p.findall('.//w:t',ns)) for p in root.findall('.//w:p',ns)]
          word='\n'.join(paras)
          pdf=' '.join((out/'pdf.txt').read_text(encoding='utf-8',errors='ignore').split())
          word_required=['No dia 03 de fevereiro de 2027, narrativa pública personalizada para validar a revisão 0628.','Segundo parágrafo público preservado.','Em vistoria presencial realizada no dia 04 de fevereiro de 2027, foi executada a conferência pública dos danos.','Segundo parágrafo público da vistoria.','Em vistoria foram coletados os documentos abaixo relacionados','Laudo público','Documento coletado na validação pública']
          missing=[x for x in word_required if x not in word]
          if missing: raise SystemExit(f'Word público sem: {missing}')
          for x in word_required[:4]:
            if x not in paras: raise SystemExit(f'Word público sem parágrafo real: {x}')
          pdf_required=['03 de fevereiro de 2027','narrativa pública personalizada','Segundo parágrafo público preservado.','04 de fevereiro de 2027','conferência pública dos danos','Segundo parágrafo público da vistoria.','Em vistoria foram coletados os documentos abaixo relacionados','Laudo público','Documento coletado na validação pública']
          missing=[x for x in pdf_required if x not in pdf]
          if missing: raise SystemExit(f'PDF público sem: {missing}')
          if word.count('Em vistoria foram coletados os documentos abaixo relacionados')!=1 or pdf.count('Em vistoria foram coletados os documentos abaixo relacionados')!=1: raise SystemExit('Introdução documental pública não é única')
          print('Publicação 0628 validada: aplicação, persistência, backup, prévia, Word e PDF.')
          PY
          cat "$OUT/public-result.json"
          cat "$OUT/pdfinfo.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0628-public-validation
          path: /tmp/v0628-public
          if-no-files-found: warn

      - name: Remove temporary verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-v0628-public.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-v0628-public.yml
          git commit -m 'chore(v06): remover verificação pública temporária 0628'
          git push origin HEAD:verification/v0628-public
