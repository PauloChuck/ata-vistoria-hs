name: Validate V0628 acceptance V3

on:
  push:
    branches:
      - feature/v062-editable-narratives-doc-intro
    paths:
      - .github/workflows/validate-v0628-acceptance-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Run acceptance suite and validate exports
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0628-acceptance
          mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/test_v0628_acceptance.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace("await page.waitForFunction((expected)=>document.querySelector('#occurrenceNarrative')?.value===expected,{timeout:30000},occurrence);","await page.waitForFunction((expected)=>document.querySelector('#occurrenceNarrative')?.value===expected,occurrence,{timeout:30000});")
          text=text.replace("await page.waitForFunction((expected)=>document.querySelector('#occurrenceNarrative')?.value===expected,{timeout:30000},finalOccurrence);","await page.waitForFunction((expected)=>document.querySelector('#occurrenceNarrative')?.value===expected,finalOccurrence,{timeout:30000});")
          text=text.replace("await page.waitForSelector('#printHost .report-page');","await page.waitForSelector('#printHost .report-page',{state:'attached'});")
          path.write_text(text,encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          OUT="$OUT" TEST_URL="http://127.0.0.1:8000/fast_track/v062.html?v=0628-acceptance-v3" NODE_PATH="$PWD/node_modules" node .github/scripts/test_v0628_acceptance.js

          DOCX="$OUT/Relatorio_Fast_Track_v0628.docx"
          PDF="$OUT/Relatorio_Fast_Track_v0628.pdf"
          test -s "$DOCX"
          test -s "$PDF"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF" "$OUT/pdf.txt"
          pdfinfo "$PDF" > "$OUT/pdfinfo.txt"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          out=Path('/tmp/v0628-acceptance')
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          root=ET.parse(out/'docx/word/document.xml').getroot()
          paragraphs=[''.join((t.text or '') for t in p.findall('.//w:t',ns)) for p in root.findall('.//w:p',ns)]
          word='\n'.join(paragraphs)
          pdf=(out/'pdf.txt').read_text(encoding='utf-8',errors='ignore')
          required=[
            'No dia 04 de novembro de 2026, uma tempestade severa atingiu a propriedade, conforme texto personalizado.',
            'Parágrafo adicional com acentuação: ocorrência, vistoria e constatação.',
            'Em vistoria presencial realizada no dia 10 de novembro de 2026, foram conferidos os danos e remanescentes.',
            'Parágrafo adicional da vistoria.',
            'Em vistoria foram coletados os documentos abaixo relacionados',
            'Orçamento detalhado',
            'Composição dos reparos'
          ]
          for label,text in [('Word',word),('PDF',pdf)]:
            missing=[value for value in required if value not in text]
            if missing:
              raise SystemExit(f'{label}: textos ausentes: {missing}')
            if text.count('Em vistoria foram coletados os documentos abaixo relacionados') != 1:
              raise SystemExit(f'{label}: frase introdutória documental não aparece uma única vez')
            if 'Documentos não apresentados até o momento.' in text:
              raise SystemExit(f'{label}: declaração de ausência contraditória')
          for value in required[:4]:
            if value not in paragraphs:
              raise SystemExit(f'Word: narrativa não preservada em parágrafo real: {value}')
          print('Word e PDF validados com narrativas personalizadas, parágrafos e introdução documental única.')
          PY
          cat "$OUT/acceptance-result.json"
          cat "$OUT/pdfinfo.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0628-acceptance-v3
          path: /tmp/v0628-acceptance
          if-no-files-found: warn
