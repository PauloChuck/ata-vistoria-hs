name: Verify V0632 public cooperator lookup

on:
  push:
    branches:
      - verification/v0632-public
    paths:
      - .github/workflows/verify-v0632-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser and document tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0632-public-node /tmp/v0632-public-validation
          cd /tmp/v0632-public-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Run acceptance tests against GitHub Pages
        shell: bash
        env:
          V0632_OUT: /tmp/v0632-public-validation
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/PauloChuck/ata-vistoria-hs/60fe9b40c134c6aac1d4b9f0aca8312d969b018f/.github/scripts/validate_v0632.js" -o /tmp/validate_v0632_public.js
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/validate_v0632_public.js')
          text=path.read_text(encoding='utf-8')
          old='http://127.0.0.1:8000/fast_track/v062.html?v=0632-ci'
          new='https://paulochuck.github.io/ata-vistoria-hs/fast_track/v062.html?v=0632-public-final'
          if old not in text:
              raise SystemExit('URL local esperada não encontrada no roteiro de validação')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          NODE_PATH=/tmp/v0632-public-node/node_modules node /tmp/validate_v0632_public.js

      - name: Validate public Word and PDF outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0632-public-validation
          DOCX="$OUT/Relatorio_Fast_Track_V0632.docx"
          PDF_BROWSER="$OUT/Relatorio_Fast_Track_V0632.pdf"
          test -s "$DOCX"
          test -s "$PDF_BROWSER"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/render" "$OUT/lo-profile"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF_BROWSER" "$OUT/browser.txt"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF_WORD=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$PDF_WORD"
          pdftotext -layout "$PDF_WORD" "$OUT/word.txt"
          pdftoppm -png -r 105 "$PDF_WORD" "$OUT/render/page" >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          out=Path('/tmp/v0632-public-validation')
          browser=(out/'browser.txt').read_text(encoding='utf-8',errors='ignore')
          word=(out/'word.txt').read_text(encoding='utf-8',errors='ignore')
          xml=(out/'docx/word/document.xml').read_text(encoding='utf-8',errors='ignore')

          def norm(value):
              value=re.sub(r'(?<=\w)-\s+(?=\w)','-',value)
              return re.sub(r'\s+',' ',value).strip().upper()

          required=[
              'DADOS CONFIRMADOS DO LOCAL','JOSÉ DA SILVA','LINHA ALFA — PROPRIEDADE CONFIRMADA',
              'VR DE BENFEITORIAS','1.250.000,00','VR DE ANIMAIS','250.000,00',
              'AURORA — AVES DE CORTE','BASE 2026-10','AV-01',
              'CAPACIDADE DE ALOJAMENTO: 18.000 AVES','VERSÃO DA BASE UTILIZADA'
          ]
          forbidden=['AV-02','LINHA LAR','ENDOSSO 018/2026','9.999.999,00','AVES AVES']
          for name,source in [('PDF público do navegador',browser),('PDF do Word público',word)]:
              value=norm(source)
              for item in required:
                  if norm(item) not in value:
                      raise SystemExit(f'{name}: conteúdo ausente: {item}')
              for item in forbidden:
                  if norm(item) in value:
                      raise SystemExit(f'{name}: conteúdo indevido presente: {item}')
              if len(re.findall(r'(?im)^\s*VR de benfeitorias\s*:',source)) != 1:
                  raise SystemExit(f'{name}: VR de benfeitorias ausente ou duplicado')
              if len(re.findall(r'(?im)^\s*VR de animais\s*:',source)) != 1:
                  raise SystemExit(f'{name}: VR de animais ausente ou duplicado')

          xmln=norm(xml)
          for item in ['DADOS CONFIRMADOS DO LOCAL','VR DE BENFEITORIAS','VR DE ANIMAIS','AV-01','18.000 AVES']:
              if norm(item) not in xmln:
                  raise SystemExit(f'OOXML público: conteúdo ausente: {item}')
          if 'AVES AVES' in xmln:
              raise SystemExit('OOXML público: unidade de capacidade duplicada')

          result=json.loads((out/'browser-result.json').read_text(encoding='utf-8'))
          assert result['baseCounts']=={'aurora':3,'lar':1,'suinos':1,'jagua':1,'matrizes':1,'larPostura':1}
          assert result['backupSelection']['confirmed']['vrBuildings']=='R$ 1.250.000,00'
          assert result['backupSelection']['original']['vrBuildings']=='R$ 1.200.000,00'
          assert result['backupSelection']['confirmed']['vrAnimals']=='R$ 250.000,00'
          assert len([item for item in result['backupSelection']['confirmed']['installations'] if item['involved']])==1
          assert any('VERIFICAR ENDOSSO' in warning for warning in result['pendingWarnings'])
          assert any('Coordenadas' in warning for warning in result['pendingWarnings'])
          assert not result['pageErrors'] and not result['consoleErrors'] and not result['httpErrors']
          pages=list((out/'render').glob('page-*.png'))
          if not pages:
              raise SystemExit('Nenhuma página pública foi renderizada a partir do Word')
          summary=(
              f"Aplicação pública carregada: sim\n"
              f"Bases reconhecidas: {len(result['baseCounts'])}\n"
              f"Registros totais do teste: {sum(result['baseCounts'].values())}\n"
              f"Páginas da prévia: {result['preview']['pages']}\n"
              f"Instalações selecionadas: 1 de 2\n"
              f"VR de benfeitorias e animais separados: sim\n"
              f"Endosso pendente e coordenada inconsistente sinalizados: sim\n"
              f"Atualização da base preservou o relatório confirmado: sim\n"
              f"Páginas renderizadas do Word: {len(pages)}\n"
          )
          (out/'public-validation-summary.txt').write_text(summary,encoding='utf-8')
          print(summary)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0632-public-validation
          path: /tmp/v0632-public-validation
          if-no-files-found: warn
