name: Diagnose V0628 narrative modes
on:
  push:
    branches: [feature/v062-editable-narratives-doc-intro]
    paths: [.github/workflows/diagnose-v0628-modes.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/test.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const p=await b.newPage();
            await p.goto('http://127.0.0.1:8000/fast_track/v062.html?v=modes',{waitUntil:'networkidle'});
            await p.waitForFunction(()=>document.querySelector('#inspectionNarrative')?.value.length>0);
            const go=async s=>{await p.evaluate(x=>document.querySelector(`[data-go="${x}"]`).click(),s);await p.waitForSelector(`.screen[data-step="${s}"].active`)};
            await p.fill('#lossDate','2027-02-03'); await go(2);
            const o='No dia 03 de fevereiro de 2027, texto final da ocorrência.\nSegundo parágrafo da ocorrência.'; await p.fill('#occurrenceNarrative',o);
            await go(3); await p.fill('#inspectionDate','2026-12-15');
            const i='Em vistoria presencial realizada no dia 15 de dezembro de 2026, texto final da vistoria.\nSegundo parágrafo da vistoria.'; await p.fill('#inspectionNarrative',i);
            await p.waitForTimeout(2500);
            const read=()=>p.evaluate(()=>new Promise((res,rej)=>{const r=indexedDB.open('HSFastTrackV06Direct',1);r.onsuccess=()=>{const q=r.result.transaction('state').objectStore('state').get('current');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)};r.onerror=()=>rej(r.error)}));
            let x=await read();console.log('BEFORE',JSON.stringify({o:x.fields.occurrenceNarrative,om:x.fields.occurrenceNarrativeMode,od:x.fields.occurrenceNarrativeDate,i:x.fields.inspectionNarrative,im:x.fields.inspectionNarrativeMode,id:x.fields.inspectionNarrativeDate},null,2));
            await p.reload({waitUntil:'networkidle'});await p.waitForFunction(()=>document.querySelector('#inspectionNarrative')?.value.length>0);await p.waitForTimeout(1000);
            x=await read();console.log('AFTERDB',JSON.stringify({o:x.fields.occurrenceNarrative,om:x.fields.occurrenceNarrativeMode,od:x.fields.occurrenceNarrativeDate,i:x.fields.inspectionNarrative,im:x.fields.inspectionNarrativeMode,id:x.fields.inspectionNarrativeDate},null,2));
            console.log('AFTERDOM',JSON.stringify({o:await p.inputValue('#occurrenceNarrative'),i:await p.inputValue('#inspectionNarrative')},null,2));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node /tmp/test.js
