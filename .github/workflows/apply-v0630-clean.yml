name: Apply V0630 clean

on:
  push:
    branches:
      - feature/v0630-parecer-evidencias-reset-v2
    paths:
      - .github/workflows/apply-v0630-clean.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy validated production files and clean source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='feature/v0630-parecer-evidencias-reset'
          git fetch origin "$SOURCE"
          files=(
            fast_track/v062.html
            fast_track/v06.html
            fast_track/v06/direct-app-0630.js
            fast_track/v06/direct-layout-0630.css
            fast_track/v06/direct-layout-0630.js
            fast_track/v06/direct-word-0630.js
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/$SOURCE:$file" > "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          app = Path('fast_track/v06/direct-app-0630.js')
          text = app.read_text(encoding='utf-8')
          marker = '\n  function validationErrors({signed = false} = {}) {'
          positions = []
          start = 0
          while True:
              pos = text.find(marker, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + len(marker)
          if len(positions) != 2:
              raise SystemExit(f'Esperadas 2 definições de validationErrors, encontradas {len(positions)}')
          text = text[:positions[0]] + text[positions[1]:]
          if 'numms[0]' in text or 'warning = \'As datas da cronologia' in text:
              raise SystemExit('Bloco duplicado inválido não foi removido por completo')
          app.write_text(text, encoding='utf-8')

          html = Path('fast_track/v062.html')
          value = html.read_text(encoding='utf-8')
          value = value.replace('>+ Adicionar fotos</button>', '>Adicionar + fotos</button>')
          html.write_text(value, encoding='utf-8')
          PY

          node --check fast_track/v06/direct-app-0630.js
          node --check fast_track/v06/direct-layout-0630.js
          node --check fast_track/v06/direct-word-0630.js
          test "$(grep -c 'function validationErrors' fast_track/v06/direct-app-0630.js)" -eq 1
          grep -q '>Adicionar + fotos</button>' fast_track/v062.html
          ! grep -q 'id="documentInput"' fast_track/v062.html
          ! grep -q 'id="documentList"' fast_track/v062.html
          ! grep -q 'id="noDocuments"' fast_track/v062.html

      - name: Commit production revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v062.html fast_track/v06.html fast_track/v06/direct-app-0630.js fast_track/v06/direct-layout-0630.css fast_track/v06/direct-layout-0630.js fast_track/v06/direct-word-0630.js
          git commit -m 'feat(v0630): parecer 4.2 evidências e reinício de sessão'
          git push origin HEAD:feature/v0630-parecer-evidencias-reset-v2
