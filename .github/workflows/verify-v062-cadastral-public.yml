name: Verify V062 public cadastral paragraphs

on:
  push:
    branches:
      - verification/v062-cadastral-public

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tools
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Validate deployed preview PDF and Word
        run: |
          set -euo pipefail
          OUT=/tmp/v062-cadastral-public
          mkdir -p "$OUT"
          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node .github/scripts/test_v062_public_cadastral.js
          DOCX="$OUT/Relatorio_Fast_Track_Cadastral_v0627_public.docx"
          PDF="$OUT/Relatorio_Fast_Track_Cadastral_v0627_public.pdf"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 .github/scripts/validate_v062_public_cadastral.py docx
          pdftotext -layout "$PDF" "$OUT/pdf.txt"
          python3 .github/scripts/validate_v062_public_cadastral.py pdf
          pdfinfo "$PDF" > "$OUT/pdfinfo.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: fast-track-v062-public-cadastral-0627
          path: /tmp/v062-cadastral-public

      - name: Remove temporary public validation files
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-v062-cadastral-public.yml
          rm -f .github/scripts/test_v062_public_cadastral.js .github/scripts/validate_v062_public_cadastral.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-v062-cadastral-public.yml .github/scripts
          git commit -m 'chore(v06): remover validação pública temporária dos dados cadastrais'
          git push origin HEAD:verification/v062-cadastral-public
