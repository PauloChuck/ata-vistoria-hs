name: Validate V0631 documentais e parecer

on:
  push:
    branches:
      - feature/v0631-documentais-parecer
    paths:
      - .github/workflows/validate-v0631-documentais-parecer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check fast_track/v06/direct-app-0631.js
          node --check fast_track/v06/direct-layout-0631.js
          node --check fast_track/v06/direct-word-0631.js
          test "$(grep -c 'id=\"documentaryNarrative\"' fast_track/v062.html)" -eq 1
          test "$(grep -c 'id=\"regulatorOpinion\"' fast_track/v062.html)" -eq 1
          grep -q '4.2. Lavantamentos documentais' fast_track/v062.html
          grep -q '5. Parecer do regulador' fast_track/v062.html
          grep -q 'documentaryNarrative' fast_track/v06/direct-app-0631.js
          grep -q '4.2. LAVANTAMENTOS DOCUMENTAIS' fast_track/v06/direct-layout-0631.js
          grep -q '5. PARECER DO REGULADOR' fast_track/v06/direct-layout-0631.js
          grep -q "heading('6. DEMONSTRATIVO DE INDENIZAÇÃO')" fast_track/v06/direct-word-0631.js
          ! grep -q '4.2. PARECER DO REGULADOR' fast_track/v06/direct-layout-0631.js
          ! grep -q "subheading('4.2. PARECER DO REGULADOR')" fast_track/v06/direct-word-0631.js

      - name: Prepare browser and document tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0631-node /tmp/v0631-validation
          cd /tmp/v0631-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Browser acceptance and exports
        shell: bash
        env:
          V0631_OUT: /tmp/v0631-validation
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >"$V0631_OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          NODE_PATH=/tmp/v0631-node/node_modules node .github/scripts/validate_v0631.js

      - name: Validate Word and PDF contents
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v0631-validation
          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          PDF_BROWSER="$OUT/relatorio-browser-v0631.pdf"
          test -s "$DOCX"
          test -s "$PDF_BROWSER"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/render" "$OUT/lo-profile"
          unzip -q "$DOCX" -d "$OUT/docx"
          pdftotext -layout "$PDF_BROWSER" "$OUT/browser.txt"
          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF_WORD=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$PDF_WORD"
          pdftotext -layout "$PDF_WORD" "$OUT/word.txt"
          pdftoppm -png -r 105 "$PDF_WORD" "$OUT/render/page" >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          out = Path('/tmp/v0631-validation')
          browser = (out / 'browser.txt').read_text(encoding='utf-8', errors='ignore')
          word = (out / 'word.txt').read_text(encoding='utf-8', errors='ignore')
          document = (out / 'docx/word/document.xml').read_text(encoding='utf-8', errors='ignore')
          outputs = {'PDF do navegador': browser, 'PDF renderizado do Word': word}
          required = [
              '4.2. LAVANTAMENTOS DOCUMENTAIS',
              'Texto documental ajustado pelo regulador',
              'IMAGENS E ARQUIVOS',
              'Registro jornalístico regional validado',
              'laudo-causa.pdf',
              '5. PARECER DO REGULADOR',
              'Parecer final ajustado pelo regulador',
              '6. DEMONSTRATIVO DE INDENIZAÇÃO',
              '7. DECLARAÇÃO DE OUTROS SEGUROS',
              '8. CRONOLOGIA',
              '9. INFORMAÇÕES COMPLEMENTARES'
          ]
          forbidden = ['4.2. PARECER DO REGULADOR', '5. DEMONSTRATIVO DE INDENIZAÇÃO', 'documento-antigo.pdf']

          def normalize(value):
              return re.sub(r'\s+', ' ', value).strip().upper()

          for name, source in outputs.items():
              value = normalize(source)
              for item in required:
                  if normalize(item) not in value:
                      raise SystemExit(f'{name}: conteúdo esperado ausente: {item}')
              for item in forbidden:
                  if normalize(item) in value:
                      raise SystemExit(f'{name}: conteúdo antigo encontrado: {item}')
              if value.count('4.2. LAVANTAMENTOS DOCUMENTAIS') != 1:
                  raise SystemExit(f'{name}: seção 4.2 duplicada ou ausente')
              if value.count('5. PARECER DO REGULADOR') != 1:
                  raise SystemExit(f'{name}: parecer duplicado ou ausente')
              order = [normalize(item) for item in [
                  '4.2. LAVANTAMENTOS DOCUMENTAIS',
                  'Texto documental ajustado pelo regulador',
                  'IMAGENS E ARQUIVOS',
                  'Registro jornalístico regional validado',
                  'laudo-causa.pdf',
                  '5. PARECER DO REGULADOR',
                  'Parecer final ajustado pelo regulador',
                  '6. DEMONSTRATIVO DE INDENIZAÇÃO'
              ]]
              indexes = [value.index(item) for item in order]
              if indexes != sorted(indexes) or len(set(indexes)) != len(indexes):
                  raise SystemExit(f'{name}: ordem incorreta: {indexes}')

          doc_upper = normalize(document)
          for item in ['LAVANTAMENTOS DOCUMENTAIS', 'PARECER DO REGULADOR', 'DEMONSTRATIVO DE INDENIZAÇÃO']:
              if normalize(item) not in doc_upper:
                  raise SystemExit(f'OOXML do Word: conteúdo ausente: {item}')
          media = list((out / 'docx/word/media').glob('*'))
          if len(media) < 6:
              raise SystemExit(f'Quantidade insuficiente de mídias no DOCX: {len(media)}')
          result = json.loads((out / 'browser-result.json').read_text(encoding='utf-8'))
          if result['migrated']['opinion'] != 'Parecer anteriormente preenchido na antiga seção 4.2 e preservado integralmente no novo tópico 5.':
              raise SystemExit('Parecer legado não foi preservado')
          if result['afterReload']['evidence'] != 2:
              raise SystemExit('Anexos não permaneceram vinculados à seção 4.2')
          if result['preview']['documentaryCount'] != 1 or result['preview']['opinionCount'] != 1:
              raise SystemExit('Duplicidade de seções na prévia')
          summary = (
              f"Páginas da prévia: {result['preview']['pages']}\n"
              f"Parecer legado preservado: sim\n"
              f"Texto documental persistente: sim\n"
              f"Anexos preservados após recarga: {result['afterReload']['evidence']}\n"
              f"Mídias no DOCX: {len(media)}\n"
          )
          (out / 'validation-summary.txt').write_text(summary, encoding='utf-8')
          print(summary)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-track-v0631-validation
          path: /tmp/v0631-validation
          if-no-files-found: warn
