name: Fix V062 table separator

on:
  push:
    branches:
      - fix/v062-footer-fonts-flow
    paths:
      - .github/workflows/fix-v062-table-separator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert separator between Word tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('fast_track/v06/direct-word.js')
          text=path.read_text(encoding='utf-8')
          old="new Table({width:{size:9072,type:WidthType.DXA},layout:TableLayoutType.FIXED,columnWidths:[635,3084,1542,1089,1361,1361],rows:[indemnityHeader,...indemnityDataRows]}),\n      new Table({width:{size:62,type:WidthType.PERCENTAGE},alignment:AlignmentType.RIGHT,rows:["
          new="new Table({width:{size:9072,type:WidthType.DXA},layout:TableLayoutType.FIXED,columnWidths:[635,3084,1542,1089,1361,1361],rows:[indemnityHeader,...indemnityDataRows]}),\n      new Paragraph({spacing:{after:0,line:20}}),\n      new Table({width:{size:62,type:WidthType.PERCENTAGE},alignment:AlignmentType.RIGHT,rows:["
          if old not in text:
              raise SystemExit('Sequência das tabelas não localizada')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check fast_track/v06/direct-word.js
          grep -q 'new Paragraph({spacing:{after:0,line:20}})' fast_track/v06/direct-word.js

      - name: Prepare validation
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Generate and inspect Word
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-table-separator
          mkdir -p "$OUT"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > "$OUT/test.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const makeDamage=i=>({id:`d${i}`,description:i%3===0?`Item ${i} — descrição técnica extensa para verificar a quebra de linha e a continuidade da tabela sem espaços vazios artificiais`:`Item ${i} — material danificado apurado em vistoria`,quantity:String(i*7.5),unit:i%2?'un.':'m²',age:String((i%8)+1),ageUnit:i%4?'anos':'meses',claimedTotal:String(900+i*173.45),assessedTotal:String(850+i*163.25)});
          const svg=`data:image/svg+xml;charset=UTF-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#e8eef1"/><path d="M40 700 L1160 100" stroke="#777" stroke-width="35"/></svg>')}`;
          const state={version:'0.6.2',fields:{insurerClaim:'1325000',hsClaim:'S2609000',insurer:'SOMPO SEGUROS S/A',insured:'COOPERATIVA CENTRAL AURORA ALIMENTOS',claimantName:'Cooperado Teste',claimantCpf:'000.000.000-00',riskAddress:'Linha Teste, Município/SC',policyNumber:'9600131927',productName:'RISCOS NOMEADOS',broker:'ALPER CONSULTORIA E CORRETORA DE SEGUROS S/A',lossDate:'2026-11-04',coverageName:'Vendaval / Granizo',inspectionDate:'2026-11-10',regulatorOpinion:'Diante do exposto, o sinistro está amparado pela cobertura de Vendaval/Granizo da apólice.',otherInsurance:'nao',bankName:'CRESOL',bankAgency:'02508',bankAccount:'001.801-5',noticeDate:'2026-11-05',scheduleDate:'2026-11-06',reportCity:'Blumenau (SC)',reportDate:'2026-11-10',regulatorName:'Paulo R. Schlosser',regulatorCpf:'068.613.739-66',noDocuments:true,mapFit:'contain',mapPosX:'50',mapPosY:'50'},map:{dataUrl:svg,name:'mapa.svg',fit:'contain',posX:'50',posY:'50'},damages:Array.from({length:14},(_,i)=>makeDamage(i+1)),photos:[],documents:[],signatures:{regulator:null,claimant:null},finalizedAt:null};
          (async()=>{
            const out=process.env.OUT;
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            page.on('dialog',async d=>d.accept());
            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=0625-separator-ci',{waitUntil:'networkidle',timeout:120000});
            await page.setInputFiles('#backupInput',{name:'teste.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(state))});
            await page.waitForFunction(()=>document.querySelectorAll('#damageList .damage-card').length===14,{timeout:30000});
            await page.evaluate(()=>document.querySelector('.screen[data-step="6"] [data-go="7"]').click());
            await page.waitForSelector('.screen[data-step="7"].active');
            const downloadPromise=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await downloadPromise;
            const target=path.join(out,download.suggestedFilename());
            await download.saveAs(target);
            if(!fs.existsSync(target)||fs.statSync(target).size<20000) throw new Error('DOCX inválido');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          OUT="$OUT" NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

          DOCX=$(find "$OUT" -maxdepth 1 -name '*.docx' -print -quit)
          unzip -t "$DOCX"
          rm -rf "$OUT/docx" && mkdir -p "$OUT/docx"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('/tmp/v062-table-separator/docx')
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          body=ET.parse(root/'word/document.xml').getroot().find('.//w:body',ns)
          nodes=list(body)
          tables=[i for i,n in enumerate(nodes) if n.tag.endswith('}tbl')]
          main=tables[6]
          if not nodes[main+1].tag.endswith('}p') or not nodes[main+2].tag.endswith('}tbl'):
              raise SystemExit('Separador entre demonstrativo e quadro final ausente')
          PY

          OFFICE=$(command -v libreoffice || command -v soffice)
          mkdir -p "$OUT/lo-profile" "$OUT/render"
          "$OFFICE" -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/render" "$DOCX"
          PDF=$(find "$OUT/render" -maxdepth 1 -name '*.pdf' -print -quit)
          pdfinfo "$PDF" > "$OUT/render/pdfinfo.txt"
          pdftotext -layout "$PDF" "$OUT/render/document.txt"
          pdftotext -bbox-layout "$PDF" "$OUT/render/document-bbox.html"
          pdftoppm -png -r 120 "$PDF" "$OUT/render/page" >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          out=Path('/tmp/v062-table-separator/render')
          info=(out/'pdfinfo.txt').read_text(encoding='utf-8',errors='ignore')
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          if pages>8: raise SystemExit(f'Paginação do cenário de tabela excessiva: {pages}')
          root=ET.parse(out/'document-bbox.html').getroot(); ns={'x':'http://www.w3.org/1999/xhtml'}
          widths=[]
          for page in root.findall('.//x:page',ns):
              words=page.findall('.//x:word',ns)
              labels=[w for w in words if (w.text or '').strip() in {'Item','Descrição','apurado'}]
              if not any((w.text or '').strip()=='Descrição' for w in labels): continue
              desc=[w for w in words if (w.text or '').strip()=='Descrição']
              ap=[w for w in words if (w.text or '').strip()=='apurado']
              if desc and ap:
                  left=min(float(w.attrib['xMin']) for w in words if (w.text or '').strip()=='Item')
                  right=max(float(w.attrib['xMax']) for w in ap)
                  widths.append(right-left)
          if not widths or max(widths)<420:
              raise SystemExit(f'Demonstrativo não ocupa a largura útil: {widths}')
          text=(out/'document.txt').read_text(encoding='utf-8',errors='ignore')
          if 'Matriz - Rua XV de novembro 1336, salas 34 e 35 – Blumenau – SC – CEP 89010-903' not in text:
              raise SystemExit('Rodapé institucional ausente')
          (out/'validation.txt').write_text(f'Páginas: {pages}\nLarguras do demonstrativo (pt): {widths}\n',encoding='utf-8')
          PY
          cat "$OUT/render/validation.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v062-table-separator-validation
          path: /tmp/v062-table-separator
          if-no-files-found: warn

      - name: Commit validated separator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v062-table-separator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-word.js .github/workflows/fix-v062-table-separator.yml
          git commit -m 'fix(v06): separar demonstrativo do quadro final'
          git push origin HEAD:fix/v062-footer-fonts-flow
