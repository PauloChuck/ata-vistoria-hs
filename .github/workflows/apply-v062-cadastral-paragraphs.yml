name: Apply V062 cadastral paragraphs

on:
  push:
    branches:
      - fix/v062-cadastral-paragraphs

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cadastral section only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement inválido em {path}: {count} ocorrências')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'fast_track/v06/direct-report.js',
              '''      <div class="doc-section">8. DADOS CADASTRAIS</div>
          <p class="doc-text"><strong>Nome completo:</strong> ${esc(f.claimantName || '')}<br>
          <strong>CPF:</strong> ${esc(f.claimantCpf || '')}<br>
          <strong>Dados Bancários:</strong> ${esc(f.bankName || '')} — AG: ${esc(f.bankAgency || '')} / CC: ${esc(f.bankAccount || '')}</p>''',
              '''      <div class="doc-section">8. DADOS CADASTRAIS</div>
          <div class="cadastral-data">
            <p class="cadastral-line"><strong>Nome completo:</strong> ${esc(f.claimantName || '')}</p>
            <p class="cadastral-line"><strong>CPF:</strong> ${esc(f.claimantCpf || '')}</p>
            <p class="cadastral-line"><strong>Dados Bancários:</strong> ${esc(f.bankName || '')} — AG: ${esc(f.bankAgency || '')} / CC: ${esc(f.bankAccount || '')}</p>
          </div>'''
          )

          replace_once(
              'fast_track/v06/direct-word.js',
              r'''    const closing=[heading('7. DECLARAÇÃO DE OUTROS SEGUROS'),para(other),heading('8. DADOS CADASTRAIS'),para([run('Nome completo: ',{bold:true}),run(f.claimantName || ''),run('\nCPF: ',{bold:true}),run(f.claimantCpf || ''),run('\nDados Bancários: ',{bold:true}),run(`${f.bankName || ''} — AG: ${f.bankAgency || ''} / CC: ${f.bankAccount || ''}`)],{line:240}),heading('9. CRONOLOGIA')];''',
              '''    const cadastralParagraph = (label,value) => new Paragraph({
              children:[
                run(label,{font:'Arial',size:22,bold:true}),
                run(value,{font:'Arial',size:22})
              ],
              alignment:AlignmentType.LEFT,
              spacing:{before:0,after:160,line:240},
              keepLines:true
            });
            const closing=[
              heading('7. DECLARAÇÃO DE OUTROS SEGUROS'),
              para(other),
              heading('8. DADOS CADASTRAIS'),
              cadastralParagraph('Nome completo: ',f.claimantName || ''),
              cadastralParagraph('CPF: ',f.claimantCpf || ''),
              cadastralParagraph('Dados Bancários: ',`${f.bankName || ''} — AG: ${f.bankAgency || ''} / CC: ${f.bankAccount || ''}`),
              heading('9. CRONOLOGIA')
            ];'''
          )

          replace_once(
              'fast_track/v06/direct.css',
              '''.doc-data{line-height:1}
          .signature-line{border-top:.5pt solid #555;padding-top:2mm}''',
              '''.doc-data{line-height:1}
          .cadastral-data{font-family:Arial,sans-serif;font-size:11pt}
          .cadastral-line{margin:0 0 8pt;text-align:left;line-height:1;white-space:normal;word-break:normal;overflow-wrap:break-word;orphans:2;widows:2;break-inside:avoid;page-break-inside:avoid}
          .signature-line{border-top:.5pt solid #555;padding-top:2mm}'''
          )

          for path in ['fast_track/v062.html','fast_track/v06.html']:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count('?v=0626')
              if count < 3:
                  raise SystemExit(f'Cache-buster 0626 não encontrado como esperado em {path}: {count}')
              file.write_text(text.replace('?v=0626','?v=0627'), encoding='utf-8')
          PY
          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'fast_track/v06/direct-report.js',
              'fast_track/v06/direct-word.js',
              'fast_track/v06/direct.css',
              'fast_track/v062.html',
              'fast_track/v06.html'
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Arquivos produtivos inesperados: {sorted(changed)}')
          PY

      - name: Prepare validation tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Validate preview PDF and Word
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/v062-cadastral-paragraphs
          mkdir -p "$OUT"
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2

          cat > "$OUT/test.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async()=>{
            const out='/tmp/v062-cadastral-paragraphs';
            const browser=await chromium.launch({
              headless:true,
              executablePath:process.env.CHROME_PATH,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:1500,height:1100}});
            const pageErrors=[];
            const httpErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            page.on('response',response=>{
              if(response.status()>=400&&!/favicon\.ico/i.test(response.url())) httpErrors.push({status:response.status(),url:response.url()});
            });
            page.on('dialog',dialog=>dialog.accept());

            await page.goto('http://127.0.0.1:8000/fast_track/v062.html?v=0627-cadastral-test',{waitUntil:'networkidle',timeout:120000});
            await page.click('[data-action="load-example"]');
            await page.fill('#claimantName','AMARILDO CESAR LOPES');
            await page.fill('#claimantCpf','092.004.030-07');
            for(const step of [2,3,4,5]){
              await page.click(`[data-go="${step}"]`);
              await page.waitForSelector(`.screen[data-step="${step}"].active`);
            }
            await page.fill('#bankName','CRESOL – 133');
            await page.fill('#bankAgency','002508');
            await page.fill('#bankAccount','001.801-5');
            for(const step of [6,7]){
              await page.click(`[data-go="${step}"]`);
              await page.waitForSelector(`.screen[data-step="${step}"].active`);
            }
            await page.waitForSelector('#reportPreview .cadastral-data');

            const inspect = async rootSelector => await page.evaluate((rootSelector)=>{
              const root=document.querySelector(rootSelector);
              const heading=[...root.querySelectorAll('.doc-section')].find(el=>el.textContent.trim()==='8. DADOS CADASTRAIS');
              if(!heading) throw new Error(`Título cadastral ausente em ${rootSelector}`);
              const block=heading.nextElementSibling;
              if(!block?.classList.contains('cadastral-data')) throw new Error(`Bloco cadastral inválido em ${rootSelector}`);
              const lines=[...block.querySelectorAll(':scope > .cadastral-line')];
              const rects=lines.map(line=>line.getBoundingClientRect());
              const details=lines.map(line=>{
                const style=getComputedStyle(line);
                const strong=line.querySelector('strong');
                return {
                  text:line.textContent.trim(),
                  label:strong?.textContent || '',
                  fontFamily:style.fontFamily,
                  fontSize:parseFloat(style.fontSize),
                  lineHeight:parseFloat(style.lineHeight),
                  marginBottom:parseFloat(style.marginBottom),
                  textAlign:style.textAlign,
                  fontWeight:style.fontWeight,
                  labelWeight:strong ? getComputedStyle(strong).fontWeight : '',
                  left:line.getBoundingClientRect().left,
                  top:line.getBoundingClientRect().top,
                  bottom:line.getBoundingClientRect().bottom,
                  brCount:line.querySelectorAll('br').length
                };
              });
              return {
                count:lines.length,
                details,
                blockBrCount:block.querySelectorAll('br').length,
                nextHeading:block.nextElementSibling?.textContent.trim() || '',
                source:rootSelector,
                html:block.outerHTML
              };
            },rootSelector);

            const expected=[
              'Nome completo: AMARILDO CESAR LOPES',
              'CPF: 092.004.030-07',
              'Dados Bancários: CRESOL – 133 — AG: 002508 / CC: 001.801-5'
            ];
            const validate=result=>{
              if(result.count!==3) throw new Error(`Quantidade de parágrafos inválida: ${JSON.stringify(result)}`);
              if(JSON.stringify(result.details.map(item=>item.text))!==JSON.stringify(expected)) throw new Error(`Conteúdo cadastral inválido: ${JSON.stringify(result.details)}`);
              if(JSON.stringify(result.details.map(item=>item.label))!==JSON.stringify(['Nome completo:','CPF:','Dados Bancários:'])) throw new Error(`Rótulos inválidos: ${JSON.stringify(result.details)}`);
              if(result.blockBrCount!==0||result.details.some(item=>item.brCount!==0)) throw new Error('Foram encontrados elementos BR na seção cadastral.');
              if(result.nextHeading!=='9. CRONOLOGIA') throw new Error(`Seção seguinte alterada: ${result.nextHeading}`);
              if(result.details.some(item=>!item.fontFamily.toLowerCase().includes('arial'))) throw new Error(`Fonte inválida: ${JSON.stringify(result.details)}`);
              if(result.details.some(item=>Math.abs(item.fontSize-(11*96/72))>.2)) throw new Error(`Tamanho inválido: ${JSON.stringify(result.details)}`);
              if(result.details.some(item=>Math.abs(item.lineHeight-item.fontSize)>.3)) throw new Error(`Entrelinha inválida: ${JSON.stringify(result.details)}`);
              if(result.details.some(item=>Math.abs(item.marginBottom-(8*96/72))>.3)) throw new Error(`Espaço posterior inválido: ${JSON.stringify(result.details)}`);
              if(result.details.some(item=>item.textAlign!=='left')) throw new Error(`Alinhamento inválido: ${JSON.stringify(result.details)}`);
              if(result.details.some(item=>Number(item.fontWeight)>=600||Number(item.labelWeight)<600)) throw new Error(`Negrito/regular inválido: ${JSON.stringify(result.details)}`);
              const left=result.details[0].left;
              if(result.details.some(item=>Math.abs(item.left-left)>.5)) throw new Error(`Inícios desalinhados: ${JSON.stringify(result.details)}`);
              if(!(result.details[0].top<result.details[1].top&&result.details[1].top<result.details[2].top)) throw new Error(`Ordem vertical inválida: ${JSON.stringify(result.details)}`);
            };

            const preview=await inspect('#reportPreview');
            validate(preview);
            const cadastral=page.locator('#reportPreview .cadastral-data');
            await cadastral.screenshot({path:path.join(out,'preview-cadastral.png')});
            await page.locator('#reportPreview .report-page').filter({hasText:'8. DADOS CADASTRAIS'}).screenshot({path:path.join(out,'preview-page-cadastral.png')});

            await page.click('[data-action="export-pdf"]');
            await page.waitForSelector('#printHost .cadastral-data',{state:'attached'});
            const print=await inspect('#printHost');
            validate(print);
            await page.emulateMedia({media:'print'});
            await page.pdf({
              path:path.join(out,'Relatorio_Fast_Track_Cadastral_v0627.pdf'),
              format:'A4',
              printBackground:true,
              preferCSSPageSize:true,
              margin:{top:'0',right:'0',bottom:'0',left:'0'}
            });
            await page.emulateMedia({media:'screen'});

            const pending=page.waitForEvent('download',{timeout:120000});
            await page.click('[data-action="export-word"]');
            const download=await pending;
            const wordPath=path.join(out,'Relatorio_Fast_Track_Cadastral_v0627.docx');
            await download.saveAs(wordPath);
            if(!fs.existsSync(wordPath)||fs.statSync(wordPath).size<15000) throw new Error('DOCX inválido');

            await page.evaluate(()=>{
              const input=document.getElementById('claimantName');
              input.value='NOME COMPLETO EXTENSO DO COOPERADO PARA VALIDAR A CONTINUAÇÃO AUTOMÁTICA NA LINHA SEGUINTE SEM MESCLAR O CONTEÚDO COM O CAMPO DE CPF';
              input.dispatchEvent(new Event('input',{bubbles:true}));
            });
            await page.waitForTimeout(250);
            const longValue=await inspect('#reportPreview');
            if(longValue.count!==3||longValue.details[0].bottom-longValue.details[0].top<=longValue.details[0].lineHeight*1.5) throw new Error(`Valor longo não quebrou dentro do próprio parágrafo: ${JSON.stringify(longValue)}`);
            if(!(longValue.details[0].bottom<=longValue.details[1].top)) throw new Error(`Valor longo sobrepôs o CPF: ${JSON.stringify(longValue)}`);

            if(pageErrors.length||httpErrors.length) throw new Error(JSON.stringify({pageErrors,httpErrors}));
            fs.writeFileSync(path.join(out,'validation.json'),JSON.stringify({preview,print,longValue,wordBytes:fs.statSync(wordPath).size},null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node "$OUT/test.js"

          DOCX="$OUT/Relatorio_Fast_Track_Cadastral_v0627.docx"
          PDF="$OUT/Relatorio_Fast_Track_Cadastral_v0627.pdf"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/lo-profile" "$OUT/word-render"
          unzip -q "$DOCX" -d "$OUT/docx"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root=Path('/tmp/v062-cadastral-paragraphs/docx')
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          body=ET.parse(root/'word/document.xml').getroot().find('.//w:body',ns)
          nodes=list(body)
          W=ns['w']
          def attr(name): return f'{{{W}}}{name}'
          def txt(node): return ''.join((t.text or '') for t in node.findall('.//w:t',ns))

          index=next(i for i,node in enumerate(nodes) if node.tag.endswith('}p') and txt(node)=='8. DADOS CADASTRAIS')
          paragraphs=nodes[index+1:index+4]
          if len(paragraphs)!=3 or not all(p.tag.endswith('}p') for p in paragraphs):
              raise SystemExit('Os dados cadastrais não foram gerados em três parágrafos reais.')
          expected=[
              'Nome completo: AMARILDO CESAR LOPES',
              'CPF: 092.004.030-07',
              'Dados Bancários: CRESOL – 133 — AG: 002508 / CC: 001.801-5'
          ]
          if [txt(p) for p in paragraphs] != expected:
              raise SystemExit(f'Conteúdo dos parágrafos inválido: {[txt(p) for p in paragraphs]}')
          if txt(nodes[index+4])!='9. CRONOLOGIA':
              raise SystemExit('O título 9. CRONOLOGIA não sucede os três parágrafos cadastrais.')

          for number,p in enumerate(paragraphs,1):
              if p.findall('.//w:br',ns) or p.findall('.//w:tab',ns):
                  raise SystemExit(f'Quebra manual ou tabulação encontrada no parágrafo {number}.')
              ppr=p.find('./w:pPr',ns)
              spacing=ppr.find('./w:spacing',ns) if ppr is not None else None
              jc=ppr.find('./w:jc',ns) if ppr is not None else None
              if spacing is None or spacing.attrib.get(attr('line'))!='240' or spacing.attrib.get(attr('after'))!='160':
                  raise SystemExit(f'Espaçamento inválido no parágrafo {number}: {ET.tostring(p,encoding="unicode")}')
              if jc is None or jc.attrib.get(attr('val'))!='left':
                  raise SystemExit(f'Alinhamento inválido no parágrafo {number}.')
              runs=p.findall('./w:r',ns)
              if len(runs)!=2:
                  raise SystemExit(f'Quantidade de runs inválida no parágrafo {number}: {len(runs)}')
              first_rpr=runs[0].find('./w:rPr',ns)
              second_rpr=runs[1].find('./w:rPr',ns)
              if first_rpr.find('./w:b',ns) is None or second_rpr.find('./w:b',ns) is not None:
                  raise SystemExit(f'Negrito/regular inválido no parágrafo {number}.')
              for rpr in (first_rpr,second_rpr):
                  fonts=rpr.find('./w:rFonts',ns)
                  size=rpr.find('./w:sz',ns)
                  if fonts is None or fonts.attrib.get(attr('ascii'))!='Arial' or size is None or size.attrib.get(attr('val'))!='22':
                      raise SystemExit(f'Fonte/tamanho inválido no parágrafo {number}.')
          print('DOCX validado: três parágrafos reais, Arial 11 pt, linha simples e 8 pt após.')
          PY

          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/word-render" "$DOCX"
          WORDPDF=$(find "$OUT/word-render" -name '*.pdf' -print -quit)
          test -s "$WORDPDF"

          pdftotext -layout "$PDF" "$OUT/browser-pdf.txt"
          pdftotext -layout "$WORDPDF" "$OUT/word-pdf.txt"
          python3 - <<'PY'
          from pathlib import Path

          expected=[
              'Nome completo: AMARILDO CESAR LOPES',
              'CPF: 092.004.030-07',
              'Dados Bancários: CRESOL – 133 — AG: 002508 / CC: 001.801-5'
          ]
          for name in ['browser-pdf.txt','word-pdf.txt']:
              lines=[line.strip() for line in Path('/tmp/v062-cadastral-paragraphs',name).read_text(encoding='utf-8',errors='ignore').splitlines()]
              positions=[]
              for value in expected:
                  matches=[i for i,line in enumerate(lines) if value in line]
                  if len(matches)!=1:
                      raise SystemExit(f'{name}: campo não encontrado em linha própria: {value!r}; ocorrências={matches}')
                  positions.append(matches[0])
              if not positions[0] < positions[1] < positions[2]:
                  raise SystemExit(f'{name}: ordem cadastral inválida: {positions}')
              if len(set(positions))!=3:
                  raise SystemExit(f'{name}: campos concatenados na mesma linha: {positions}')
          print('PDFs validados: nome, CPF e dados bancários em linhas próprias e na ordem correta.')
          PY

          pdfinfo "$PDF" > "$OUT/browser-pdfinfo.txt"
          pdfinfo "$WORDPDF" > "$OUT/word-pdfinfo.txt"
          mkdir -p "$OUT/browser-pages" "$OUT/word-pages"
          pdftoppm -png -r 120 "$PDF" "$OUT/browser-pages/page" >/dev/null 2>&1
          pdftoppm -png -r 120 "$WORDPDF" "$OUT/word-pages/page" >/dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: v062-cadastral-paragraphs-validation
          path: /tmp/v062-cadastral-paragraphs

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v062-cadastral-paragraphs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-report.js fast_track/v06/direct-word.js fast_track/v06/direct.css fast_track/v062.html fast_track/v06.html .github/workflows/apply-v062-cadastral-paragraphs.yml
          git commit -m 'fix(v06): separar dados cadastrais em três parágrafos'
          git push origin HEAD:fix/v062-cadastral-paragraphs
