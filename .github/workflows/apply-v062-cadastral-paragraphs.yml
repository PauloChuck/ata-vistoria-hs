name: Apply V062 cadastral paragraphs

on:
  push:
    branches:
      - fix/v062-cadastral-paragraphs

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cadastral section only
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v062_cadastral.py
          node --check fast_track/v06/direct-report.js
          node --check fast_track/v06/direct-word.js
          git diff --check

      - name: Prepare validation tools
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Validate preview PDF and Word
        run: |
          set -euo pipefail
          OUT=/tmp/v062-cadastral-paragraphs
          mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/test_v062_cadastral.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("await page.click('[data-go=\"6\"]');", "await page.click('.screen[data-step=\"7\"].active [data-go=\"6\"]');"),
              ("await page.click('[data-go=\"7\"]');", "await page.click('.screen[data-step=\"6\"].active [data-go=\"7\"]');"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Seletor de validação inesperado: {old} ({text.count(old)})')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 >"$OUT/http.log" 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME_PATH="$CHROME_PATH" NODE_PATH="$PWD/node_modules" node .github/scripts/test_v062_cadastral.js

          DOCX="$OUT/Relatorio_Fast_Track_Cadastral_v0627.docx"
          PDF="$OUT/Relatorio_Fast_Track_Cadastral_v0627.pdf"
          unzip -t "$DOCX"
          mkdir -p "$OUT/docx" "$OUT/lo-profile" "$OUT/word-render"
          unzip -q "$DOCX" -d "$OUT/docx"
          python3 .github/scripts/validate_v062_cadastral.py docx

          libreoffice -env:UserInstallation="file://$OUT/lo-profile" --headless --convert-to pdf --outdir "$OUT/word-render" "$DOCX"
          WORDPDF=$(find "$OUT/word-render" -name '*.pdf' -print -quit)
          test -s "$WORDPDF"
          pdftotext -layout "$PDF" "$OUT/browser-pdf.txt"
          pdftotext -layout "$WORDPDF" "$OUT/word-pdf.txt"
          python3 .github/scripts/validate_v062_cadastral.py pdf browser-pdf.txt
          python3 .github/scripts/validate_v062_cadastral.py pdf word-pdf.txt

          pdfinfo "$PDF" > "$OUT/browser-pdfinfo.txt"
          pdfinfo "$WORDPDF" > "$OUT/word-pdfinfo.txt"
          mkdir -p "$OUT/browser-pages" "$OUT/word-pages"
          pdftoppm -png -r 120 "$PDF" "$OUT/browser-pages/page" >/dev/null 2>&1
          pdftoppm -png -r 120 "$WORDPDF" "$OUT/word-pages/page" >/dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: v062-cadastral-paragraphs-validation
          path: /tmp/v062-cadastral-paragraphs

      - name: Commit validated correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v062-cadastral-paragraphs.yml
          rm -f .github/scripts/patch_v062_cadastral.py .github/scripts/test_v062_cadastral.js .github/scripts/validate_v062_cadastral.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fast_track/v06/direct-report.js fast_track/v06/direct-word.js fast_track/v06/direct.css fast_track/v062.html fast_track/v06.html .github/workflows/apply-v062-cadastral-paragraphs.yml .github/scripts
          git commit -m 'fix(v06): separar dados cadastrais em três parágrafos'
          git push origin HEAD:fix/v062-cadastral-paragraphs
