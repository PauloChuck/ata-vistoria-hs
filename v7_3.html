<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ata de Vistoria HS — V7.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#eef2f5;font-family:Arial,sans-serif}#appwrap{width:100%;height:100%;min-height:100vh}#appFrame{border:0;width:100%;height:100%;min-height:100vh;display:block}#printHost{display:none}.hs-page{position:relative;width:210mm;height:297mm;background:#fff;color:#111;padding:28mm 24mm 25mm 24mm;overflow:hidden;page-break-after:always;font-size:10.5pt;line-height:1.48}.hs-page:last-child{page-break-after:auto}.hs-brand{position:absolute;top:10mm;right:18mm;display:flex;align-items:center;gap:4mm}.hs-symbol{width:31mm;height:19mm;position:relative}.hs-ring{position:absolute;border:1.8mm solid #2da9df;border-radius:50%;width:20mm;height:15mm;top:2mm}.hs-ring.a{left:0}.hs-ring.b{right:0}.hs-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2da9df;font-weight:800;font-size:19pt;letter-spacing:-2px}.hs-beyond{font-weight:800;font-size:14pt;line-height:1.05}.wm{position:absolute;left:35mm;top:88mm;width:140mm;height:120mm;opacity:.11;pointer-events:none}.wm:before,.wm:after{content:"";position:absolute;border:3mm solid #4cc7e8;border-radius:50%;width:80mm;height:80mm;top:16mm}.wm:before{left:8mm}.wm:after{right:8mm}.footer{position:absolute;left:0;right:0;bottom:8mm;height:18mm;color:#2da9df;font-size:7.8pt}.footmark{position:absolute;left:1mm;bottom:0;width:22mm;height:14mm}.footmark:before,.footmark:after{content:"";position:absolute;border:1.3mm solid #2da9df;border-radius:50%;width:13mm;height:10mm;top:1.5mm}.footmark:before{left:0}.footmark:after{right:0}.foottext{position:absolute;left:27mm;bottom:1mm;line-height:1.65}.pageno{position:absolute;right:12mm;bottom:0;color:#222;font-style:italic}.title{font-size:24pt;font-weight:400;margin-top:14mm}.subtitle{font-size:18pt;color:#2da9df;margin-top:1mm}.claimnums{margin:11mm 0 7mm 92mm;font-size:9.5pt}.claimnums .r{display:grid;grid-template-columns:1fr 1fr;gap:4mm}.meta{margin-top:7mm}.meta .row{display:grid;grid-template-columns:58mm 1fr;gap:5mm;margin:4.2mm 0}.meta b{font-weight:700}.section{font-size:14pt;font-weight:400;margin:8mm 0 7mm}.subsection{font-size:11.5pt;font-weight:700;margin:7mm 0 4mm}.text{font-size:10.5pt;text-align:justify;margin:0 0 4mm}.hs-table{width:100%;border-collapse:collapse;font-size:9.5pt;position:relative;z-index:2}.hs-table th,.hs-table td{border:.25mm solid #555;padding:2.2mm 2mm;text-align:center;vertical-align:middle}.hs-table th{font-weight:700}.damage-list{margin:2mm 0 0 7mm;padding-left:5mm}.damage-list li{margin:2mm 0}.checkrow{display:grid;grid-template-columns:9mm 1fr;gap:2mm;align-items:start;margin:4mm 3mm}.box{width:7mm;height:7mm;border:.3mm solid #555;display:flex;align-items:center;justify-content:center;font-size:10pt}.chrono{width:100%;border-collapse:collapse;margin-top:6mm;font-size:10pt}.chrono td{border-bottom:.3mm solid #555;padding:1.5mm 0}.chrono td:last-child{text-align:right;width:38mm}.date-line{text-align:right;margin-top:12mm}.sig{width:72mm;margin-left:auto;margin-top:28mm}.sig2{width:92mm;margin-left:auto;margin-top:28mm}.sigline{border-top:.3mm solid #555;padding-top:2mm;text-align:center}.small{font-size:9pt}.muted{color:#444}@media screen{#printHost.previewing{display:block;padding:16px}.hs-page{margin:0 auto 16px;box-shadow:0 2px 14px rgba(0,0,0,.16);transform-origin:top center}}@media print{@page{size:A4;margin:0}html,body{background:#fff}#appwrap{display:none!important}#printHost{display:block!important;padding:0!important}.hs-page{margin:0!important;box-shadow:none!important;transform:none!important}}
</style>
</head>
<body>
<div id="appwrap"><iframe id="appFrame" src="./index.html" title="Ata de Vistoria V7.3"></iframe></div>
<div id="printHost"></div>
<script>
const frame=document.getElementById('appFrame'),host=document.getElementById('printHost');
function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fd(v){if(!v)return 'A INFORMAR';const p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;}
function longDate(v){if(!v)return 'A INFORMAR';const [y,m,d]=v.split('-');const meses=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];return `${d} DE ${meses[+m-1]} DE ${y}`;}
function brand(){return `<div class="hs-brand"><div class="hs-symbol"><span class="hs-ring a"></span><span class="hs-ring b"></span><span class="hs-word">HS</span></div><div class="hs-beyond">beyond<br>solutions</div></div>`;}
function wm(){return '<div class="wm"></div>';}
function footer(n){return `<div class="footer"><div class="footmark"></div><div class="foottext">Matriz - Rua XV de novembro 1336, salas 34 e 35 – Blumenau – SC – CEP 89010-903<br>www.horizonservitas.com +55 47 3326-1844</div><div class="pageno">${n} de 5</div></div>`;}
function page(inner,n){return `<section class="hs-page">${brand()}${wm()}${inner}${footer(n)}</section>`;}
function instTable(a){const rows=(a||[]).map(x=>`<tr><td>${esc(x.num)}</td><td>${esc(x.year)}</td><td>${esc(x.dim)}</td><td>${esc(x.cap)}</td><td>${esc(x.state)}</td></tr>`).join('');return `<table class="hs-table"><thead><tr><th>Número</th><th>Ano de<br>Construção</th><th>Dimensões<br>(metros)</th><th>Capacidade</th><th>Estado de<br>Conservação</th></tr></thead><tbody>${rows||'<tr><td colspan="5">A INFORMAR</td></tr>'}</tbody></table>`;}
function damages(a){const rows=(a||[]).map(x=>`<li>${esc(x.qty||'')} ${esc(x.unit||'')} ${esc(x.desc||'')}${x.age?' – '+esc(x.age):''}</li>`).join('');return `<ul class="damage-list">${rows||'<li>A INFORMAR</li>'}</ul>`;}
function buildPages(d){
const p1=`<div class="title">ATA DE VISTORIA</div><div class="subtitle">RISCOS NOMEADOS EMPRESARIAL</div><div class="claimnums"><div class="r"><span>Sinistro Seguradora:</span><b>A INFORMAR</b></div><div class="r"><span>Sinistro Horizon Servitas:</span><b>${esc(d.sinistro||'A INFORMAR')}</b></div></div><div class="meta"><div class="row"><b>COMPANHIA SEGURADORA:</b><span>A INFORMAR</span></div><div class="row"><b>SEGURADO:</b><span>A INFORMAR</span></div><div class="row"><b>COOPERADO:</b><span>${esc(d.segurado||'A INFORMAR')}</span></div><div class="row"><b>LOCAL DO SINISTRO:</b><span>${esc(d.endereco||'A INFORMAR')}</span></div><div class="row"><b>APÓLICE DE SEGUROS:</b><span>A INFORMAR</span></div><div class="row"><b>PRODUTO:</b><span>RISCOS NOMEADOS</span></div><div class="row"><b>CORRETOR:</b><span>A INFORMAR</span></div><div class="row"><b>DATA DO SINISTRO:</b><span>${longDate(d.dataSinistro)}</span></div><div class="row"><b>COBERTURA RECLAMADA:</b><span>A INFORMAR</span></div></div>`;
const p2=`<div class="section">1 &nbsp; PROPRIEDADE RURAL RECLAMADA</div><p class="text">Trata-se de propriedade rural vistoriada e situada em ${esc(d.endereco||'local a informar')}${d.coords?' – coordenadas '+esc(d.coords):''}.</p>${instTable(d.inst)}<div class="small muted" style="margin-top:8mm;text-align:center">Figura / imagem da propriedade poderá ser inserida em etapa posterior.</div>`;
const p3=`<div class="section">2 &nbsp; DESCRIÇÃO DA OCORRÊNCIA PELO COOPERADO</div><p class="text">${esc(d.relato||'A INFORMAR')}</p><div class="section">3 &nbsp; APURAÇÕES DA REGULAÇÃO</div><div class="subsection">3.1 &nbsp; LEVANTAMENTOS EM VISTORIA</div><p class="text">${esc(d.constatacoes||'A INFORMAR')}</p><div class="subsection" style="margin-top:8mm">RELAÇÃO DE DANOS:</div>${damages(d.damage)}`;
const no=d.outroSeguro==='nao',yes=d.outroSeguro==='sim';
const p4=`<div class="subsection" style="margin-top:12mm">3.2 &nbsp; LEVANTAMENTOS DOCUMENTAIS</div><p class="text">${esc(d.documentos||'Não foram coletados documentos em vistoria.')}</p><div class="section">4 &nbsp; DECLARAÇÃO SOBRE OUTROS SEGUROS</div><p class="text">Para prestar a referida declaração, assinale uma das opções conforme abaixo:</p><div class="checkrow"><span class="box">${no?'X':''}</span><span>Declaro que <b>não existe</b> outra apólice de seguro que conceda cobertura ao(s) mesmo(s) bem(ns) amparado(s) pela apólice acima referenciada.</span></div><div class="checkrow"><span class="box">${yes?'X':''}</span><span>Declaro que <b>existe(m)</b> outra(s) apólice(s) de seguro que conceda(m) cobertura(s) ao(s) mesmo(s) bem(ns) amparado(s) pela apólice em questão. Caso tenha assinalado esta alternativa, informar o(s) seguro(s) / apólice(s) relacionado(s).</span></div><p class="text">Assumo ainda integral responsabilidade pela presente declaração e suas consequências, sob pena da perda de qualquer direito à indenização, caso exista outro seguro não declarado neste documento.</p><div class="section" style="margin-top:8mm">5 &nbsp; CRONOLOGIA</div><table class="chrono"><tr><td>Data da ocorrência</td><td>${fd(d.c1||d.dataSinistro)}</td></tr><tr><td>Data do aviso</td><td>${fd(d.c2)}</td></tr><tr><td>Data da solicitação de vistoria</td><td>${fd(d.c3)}</td></tr><tr><td>Data do Agendamento da vistoria</td><td>${fd(d.c4)}</td></tr><tr><td>Data da vistoria</td><td>${fd(d.c5)}</td></tr></table>`;
const p5=`<div class="section" style="margin-top:12mm">6 &nbsp; INFORMAÇÕES COMPLEMENTARES</div><p class="text">As orientações não representam o reconhecimento prévio de cobertura do sinistro ora reclamado ou de eventual valor a indenizar, os quais dependem da análise das Condições do Seguro contratado e da devida análise e manifestação da Companhia Seguradora.</p><div class="date-line">${esc(d.cidadeEmissao||'Blumenau (SC)')}, ${d.c5?fd(d.c5):fd(d.dataSinistro)}.</div><div class="sig"><div class="sigline">Regulador</div><div style="text-align:center;margin-top:3mm">${esc(d.regulador||'A INFORMAR')}</div><div style="text-align:center;margin-top:2mm">CPF: ${esc(d.cpfReg||'A INFORMAR')}</div></div><div class="sig2"><div class="sigline">Segurado / Representante</div><div style="text-align:center;margin-top:3mm">${esc(d.representante||d.segurado||'A INFORMAR')}</div><div style="text-align:center;margin-top:2mm">CPF: ${esc(d.cpfRep||d.cpfCnpj||'A INFORMAR')}</div></div>`;
host.innerHTML=page(p1,1)+page(p2,2)+page(p3,3)+page(p4,4)+page(p5,5);
}
function currentData(){try{return frame.contentWindow.vals();}catch(e){return {};}}
function printHS(){const w=frame.contentWindow;try{if(w.renderFinal)w.renderFinal();if(w.saveDraft)w.saveDraft();}catch(e){}buildPages(currentData());setTimeout(()=>window.print(),80);}
function inject(){try{const d=frame.contentDocument;const badge=d.querySelector('.badge');if(badge)badge.textContent='V7.3';const helper=d.querySelector('.head .helper');if(helper)helper.textContent='HS — formulário integrado + emissão A4';const buttons=[...d.querySelectorAll('button')];const pdf=buttons.find(b=>/Exportar\s*\/\s*Salvar PDF/i.test(b.textContent));if(pdf){pdf.removeAttribute('onclick');pdf.onclick=(e)=>{e.preventDefault();printHS();};pdf.textContent='Exportar / Salvar PDF — padrão HS';}}
catch(e){console.error(e);}}
frame.addEventListener('load',()=>setTimeout(inject,120));
</script>
</body>
</html>
